/* ═══════════════════════════════════════════════════════════
   نظام المراسلات — شات + متابعة + صور
   يعتمد على Supabase (نفس المشروع) مع جداول:
   conversations, messages, follows, user_profiles

   ── شغّل هذا SQL مرّة وحدة في: لوحة Supabase ← SQL Editor ──

   create table if not exists public.user_profiles (
     phone text primary key,
     username text unique, name text, avatar text, email text,
     verified boolean default false,
     updated_at timestamptz default now() );

   create table if not exists public.follows (
     follower text not null, following text not null,
     created_at timestamptz default now(),
     primary key (follower, following) );

   create table if not exists public.conversations (
     id uuid primary key default gen_random_uuid(),
     user1 text not null, user2 text not null,
     last_msg text, last_at timestamptz default now(),
     unique(user1, user2) );

   create table if not exists public.messages (
     id uuid primary key default gen_random_uuid(),
     conv_id uuid references conversations(id),
     sender text not null, body text,
     img text, read boolean default false,
     created_at timestamptz default now() );

   alter table public.user_profiles enable row level security;
   alter table public.follows enable row level security;
   alter table public.conversations enable row level security;
   alter table public.messages enable row level security;

   create policy "pub profiles" on public.user_profiles for all to anon,authenticated using(true) with check(true);
   create policy "pub follows" on public.follows for all to anon,authenticated using(true) with check(true);
   create policy "pub convs" on public.conversations for all to anon,authenticated using(true) with check(true);
   create policy "pub msgs" on public.messages for all to anon,authenticated using(true) with check(true);

   create index if not exists idx_msgs_conv on public.messages(conv_id, created_at);
   create index if not exists idx_convs_user on public.conversations(user1, user2);
   create index if not exists idx_follows_er on public.follows(follower);
   create index if not exists idx_follows_ing on public.follows(following);
   ══════════════════════════════════════════════════════════ */

function msgAvHTML(name,avatar,cls){
  if(avatar) return `<div class="${cls||'msg-av'}"><img src="${esc(avatar)}" alt=""></div>`;
  const p=(name||"").trim().split(/\s+/).filter(Boolean);
  const ini=((p[0]||"").charAt(0)+(p[1]||"").charAt(0)).toUpperCase()||(name||"?").charAt(0).toUpperCase();
  return `<div class="${cls||'msg-av'}"><span class="ini">${esc(ini)}</span></div>`;
}

function timeAgo(iso){
  if(!iso) return "";
  const d=new Date(iso), now=new Date(), diff=now-d;
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const yesterday=new Date(today-864e5);
  if(d>=today) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  if(d>=yesterday) return mt().yesterday;
  return d.toLocaleDateString();
}

/* ═══ ضغط صورة الشات ═══ */
function msgCompressImg(file,done){
  if(!file||!/^image\//i.test(file.type||"")) return;
  if(file.size>15*1024*1024){toast("الصورة كبيرة");return}
  const fr=new FileReader();
  fr.onerror=()=>toast("خطأ");
  fr.onload=()=>{
    const img=new Image();
    img.onerror=()=>toast("خطأ");
    img.onload=()=>{
      const MAX=600, sc=Math.min(1,MAX/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let q=.7, out=c.toDataURL("image/jpeg",q);
      while(out.length>200000&&q>.3){q-=.1;out=c.toDataURL("image/jpeg",q)}
      done(out);
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

async function msgOpenChat(phone,name,avatar,convId){
  if(!isLoggedMsg()){toast(mt().needLogin);return}
  chatWith=phone;
  document.getElementById('chat-name').textContent=name||phone;
  document.getElementById('chat-sub').textContent=phone;
  document.getElementById('chat-av').innerHTML=msgAvHTML(name,avatar,'msg-av').replace('class="msg-av"','');
  document.getElementById('chat-screen').classList.add('on');
  chatImgData=null;document.getElementById('chat-img-preview').style.display='none';
  /* زر المتابعة */
  const fb=document.getElementById('chat-follow');
  const isF=await msgIsFollowing(phone);
  fb.textContent=isF?mt().unfollow:mt().follow;
  fb.classList.toggle('following',isF);
  fb.onclick=async()=>{
    if(await msgIsFollowing(phone)){await msgUnfollow(phone);fb.textContent=mt().follow;fb.classList.remove('following')}
    else{await msgFollow(phone);fb.textContent=mt().unfollow;fb.classList.add('following')}
  };
  /* جلب/إنشاء المحادثة */
  if(convId) chatConvId=convId;
  else{const c=await msgGetOrCreateConv(phone);chatConvId=c?c.id:null}
  await msgRefreshChat();
  /* تحديث تلقائي */
  clearInterval(msgPollTimer);
  msgPollTimer=setInterval(msgRefreshChat,4000);
}

async function msgRefreshChat(){
  if(!chatConvId) return;
  const msgs=await msgFetch(chatConvId,200);
  chatMsgs=msgs;
  const box=document.getElementById('chat-msgs');
  const me=myPhone();
  let html='', lastDate='';
  msgs.forEach(m=>{
    const d=new Date(m.created_at);
    const dateStr=d.toLocaleDateString();
    if(dateStr!==lastDate){lastDate=dateStr;
      const today=new Date(), yest=new Date(today-864e5);
      let label=dateStr;
      if(d.toDateString()===today.toDateString()) label=mt().today;
      else if(d.toDateString()===yest.toDateString()) label=mt().yesterday;
      html+=`<div class="chat-date">${label}</div>`;
    }
    const isMe=m.sender===me;
    let content='';
    if(m.img) content+=`<div class="chat-img-wrap"><img class="chat-img" src="${esc(m.img)}" alt="صورة"><button class="chat-img-dl" data-src="${esc(m.img)}" title="حفظ الصورة"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg></button></div>`;
    if(m.body) content+=`<div>${esc(m.body)}</div>`;
    content+=`<div class="chat-ts">${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`;
    html+=`<div class="chat-bubble ${isMe?'me':'them'}">${content}</div>`;
  });
  box.innerHTML=html;
  box.scrollTop=box.scrollHeight;
  /* أزرار حفظ الصور */
  box.querySelectorAll('.chat-img-dl').forEach(btn=>{
    btn.onclick=e=>{ e.stopPropagation(); msgDownloadImg(btn.dataset.src); };
  });
}

/* ═══ حفظ صورة الشات بجهاز الزبون ═══ */
function msgDownloadImg(src){
  try{
    const a=document.createElement('a');
    a.href=src;
    a.download='chat-image-'+Date.now()+'.jpg';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('تم حفظ الصورة');
  }catch(e){ toast('تعذّر حفظ الصورة'); }
}

function msgCloseChat(){
  document.getElementById('chat-screen').classList.remove('on');
  chatWith=null;chatConvId=null;chatMsgs=[];
  clearInterval(msgPollTimer);
  if(msgTab==='chats') msgRenderConvs();
}

/* ═══ الملف الشخصي لشخص آخر ═══ */
async function msgOpenProfile(phone){
  if(!phone) return;
  const scr=document.getElementById('uprof-screen');
  scr.classList.add('on');
  document.getElementById('uprof-name').textContent='…';
  document.getElementById('uprof-username').textContent='';
  document.getElementById('uprof-followers-n').textContent='—';
  document.getElementById('uprof-following-n').textContent='—';
  const p=await msgGetProfile(phone);
  document.getElementById('uprof-av').innerHTML=msgAvHTML(p.name,p.avatar,'msg-av uprof-av-lg');
  document.getElementById('uprof-name').innerHTML=esc(p.name||p.phone)+(p.verified?verifiedBadge('lg'):'');
  document.getElementById('uprof-username').textContent=p.username?'@'+p.username:'';
  const [flrs,fing]=await Promise.all([msgCountFollowers(phone),msgCountFollowing(phone)]);
  document.getElementById('uprof-followers-n').textContent=flrs;
  document.getElementById('uprof-following-n').textContent=fing;
  const fb=document.getElementById('uprof-follow-btn');
  if(phone===myPhone()){ fb.style.display='none'; }
  else{
    fb.style.display='';
    const isF=await msgIsFollowing(phone);
    fb.textContent=isF?mt().unfollow:mt().follow;
    fb.onclick=async()=>{
      if(await msgIsFollowing(phone)){await msgUnfollow(phone);fb.textContent=mt().follow}
      else{await msgFollow(phone);fb.textContent=mt().unfollow}
      const nf=await msgCountFollowers(phone);
      document.getElementById('uprof-followers-n').textContent=nf;
    };
  }
  document.getElementById('uprof-msg-btn').onclick=()=>{
    msgCloseProfile();
    msgOpenChat(phone,p.name,p.avatar);
  };
}
function msgCloseProfile(){
  document.getElementById('uprof-screen').classList.remove('on');
}

/* ═══ ربط الأحداث ═══ */
function msgBoot(){
  msgFillUI();
  document.getElementById('uprof-back').onclick=msgCloseProfile;
  document.getElementById('chat-top-click').onclick=()=>{ if(chatWith) msgOpenProfile(chatWith); };
  /* تبويبات المراسلات */
  document.querySelectorAll('[data-mtab]').forEach(b=>{b.onclick=()=>{
    msgTab=b.dataset.mtab;
    document.querySelectorAll('[data-mtab]').forEach(x=>x.classList.toggle('on',x.dataset.mtab===msgTab));
    msgRenderPanel();
  }});
  /* البحث */
  let sTimer=null;
  document.getElementById('msg-q').addEventListener('input',e=>{
    clearTimeout(sTimer);
    const q=e.target.value.trim();
    if(!q){document.getElementById('msg-search-results').hidden=true;msgRenderPanel();return}
    sTimer=setTimeout(async()=>{
      const results=await msgSearchUsers(q);
      const box=document.getElementById('msg-search-results');
      box.hidden=false;
      document.getElementById('msg-conv-list').innerHTML='';
      document.getElementById('msg-empty-box').hidden=true;
      if(!results.length){box.innerHTML=`<div class="msg-empty"><b>${mt().noResults}</b></div>`;return}
      box.innerHTML=`<div class="msg-list">${results.map(p=>{
        const vb=p.verified?verifiedBadge():'';
        const un=p.username?`<span class="username-tag">@${esc(p.username)}</span>`:'';
        return `<div class="follow-item">
        ${msgAvHTML(p.name,p.avatar)}
        <div style="flex:1;min-width:0"><b>${esc(p.name||p.phone)}${vb}</b>${un}</div>
        <button class="follow-btn" data-fphone="${esc(p.phone)}" data-fname="${esc(p.name||'')}" data-fav="${esc(p.avatar||'')}">${mt().follow}</button>
        <button class="follow-btn" data-mphone="${esc(p.phone)}" data-mname="${esc(p.name||'')}" data-mav="${esc(p.avatar||'')}">💬</button>
      </div>`}).join('')}</div>`;
      box.querySelectorAll('[data-fphone]').forEach(b=>{b.onclick=async()=>{
        await msgFollow(b.dataset.fphone);b.textContent='✓';b.disabled=true}});
      box.querySelectorAll('[data-mphone]').forEach(b=>{b.onclick=()=>
        msgOpenChat(b.dataset.mphone,b.dataset.mname,b.dataset.mav)});
    },400);
  });
  /* الرجوع من المحادثة */
  document.getElementById('chat-back').onclick=msgCloseChat;
  /* إرسال رسالة */
  const sendMsg=async()=>{
    const txt=document.getElementById('chat-text').value.trim();
    if(!txt&&!chatImgData) return;
    if(!chatConvId) return;
    document.getElementById('chat-text').value='';
    const img=chatImgData;chatImgData=null;
    document.getElementById('chat-img-preview').style.display='none';
    await msgSend(chatConvId,txt,img);
    await msgRefreshChat();
  };
  document.getElementById('chat-send').onclick=sendMsg;
  document.getElementById('chat-text').addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}
  });
  /* اختيار صورة */
  document.getElementById('chat-img-btn').onclick=()=>document.getElementById('chat-file').click();
  document.getElementById('chat-file').onchange=e=>{
    const f=e.target.files&&e.target.files[0];
    if(!f) return;
    msgCompressImg(f,data=>{
      chatImgData=data;
      document.getElementById('chat-img-pre-src').src=data;
      document.getElementById('chat-img-preview').style.display='block';
    });
    e.target.value='';
  };
  document.getElementById('chat-img-x').onclick=()=>{
    chatImgData=null;document.getElementById('chat-img-preview').style.display='none';
  };
  /* تحديث textarea حجمه */
  document.getElementById('chat-text').addEventListener('input',function(){
    this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px';
  });
  /* مزامنة ملف المستخدم عند الدخول */
  if(isLoggedMsg()) msgSyncProfile();
  /* تحديث دوري لقائمة المحادثات */
  convPollTimer=setInterval(()=>{
    if(msgTab==='chats'&&!document.getElementById('chat-screen').classList.contains('on')&&
       document.querySelector('[data-go="messages"][aria-selected="true"]')){
      msgRenderConvs();
    }
  },8000);
}

document.addEventListener('contextmenu',e=>{
