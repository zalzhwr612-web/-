<style>
/* يمنع تحديد النص وقائمة الضغط الطويل (نسخ/مشاركة/بحث الويب) بكل الموقع.
   نستثني حقول الإدخال والنصوص حتى الزبون يكدر يكتب وينسخ فيها بشكل طبيعي */
*{
  -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
  -webkit-touch-callout:none;   /* يمنع قائمة آيفون */
  -webkit-tap-highlight-color:transparent;
}
input, textarea, [contenteditable="true"]{
  -webkit-user-select:text; -moz-user-select:text; -ms-user-select:text; user-select:text;
  -webkit-touch-callout:default;
}
:root{
  --bg:#FFFFFF; --wash:#F5F7FC; --card:#FFFFFF; --cardb:#FFFFFF;
  --ink:#0F1724; --muted:#6B7887; --line:#E6EAF3; --art:var(--brand-soft);
  --brand:#1B72E8; --brand-2:#4285F4; --brand-3:#7BA7FF; --brand-soft:#E8F0FE; --brand-ink:#0B3B8F;
  --amber:#F5A524; --green:#12A150;
  --font:"Tajawal",system-ui,sans-serif;
  --pad:16px; --tabh:64px; --r:16px;
  --T:2.8s cubic-bezier(.4,0,.2,1);
  --shadow:0 2px 10px rgba(15,23,36,.06);
  --shadow-lg:0 12px 30px rgba(15,23,36,.12);
}
body.dark{
  --bg:#070B14; --wash:#05070D; --card:rgba(17,24,40,.72); --cardb:#111828;
  --ink:#E9EFFA; --muted:#93A2BE; --line:rgba(255,255,255,.10); --art:rgba(255,255,255,.05);
  --shadow:0 2px 14px rgba(0,0,0,.45); --shadow-lg:0 14px 34px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--wash);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.75;
  overscroll-behavior-y:none;transition:background-color .5s,color .5s}
h1,h2,h3{font-family:var(--font);font-weight:700;line-height:1.45;margin:0}
.mono{font-family:"IBM Plex Mono",monospace;direction:ltr;unicode-bidi:isolate}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
#sky{position:fixed;inset:0;z-index:0;display:none;pointer-events:none}
body.dark #sky{display:block}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;z-index:1}

/* شفق الهيدر */
.aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(34px);opacity:.7;transition:background-color var(--T)}
.b1{width:190px;height:190px;background:var(--brand-2);top:-70px;inset-inline-start:-40px;animation:f1 19s ease-in-out infinite}
.b2{width:170px;height:170px;background:var(--brand-3);top:-40px;inset-inline-end:-50px;animation:f2 23s ease-in-out infinite}
.b3{width:150px;height:150px;background:var(--brand);bottom:-70px;inset-inline-start:35%;animation:f3 27s ease-in-out infinite}
@keyframes f1{50%{transform:translate(40px,26px) scale(1.15)}}
@keyframes f2{50%{transform:translate(-34px,30px) scale(1.1)}}
@keyframes f3{50%{transform:translate(26px,-24px) scale(1.2)}}

.topbar{position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;padding:12px var(--pad) 15px;
  border-radius:0 0 22px 22px;overflow:hidden;transition:background-color var(--T);
  box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 32%,transparent)}
.trow,.search{position:relative;z-index:2}
.trow{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:13px;background:#0F151C;flex:none;overflow:hidden;display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.14)}
.logo img{width:74%;height:auto;display:block}
.tt{min-width:0;flex:1}
.tt b{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt span{display:block;font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{position:relative;width:40px;height:40px;flex:none;border:0;border-radius:12px;background:rgba(255,255,255,.2);
  color:#fff;display:grid;place-items:center;cursor:pointer}
.hbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-5px;inset-inline-start:-5px;min-width:19px;height:19px;border-radius:99px;
  background:var(--amber);color:#3A2500;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 5px;font-family:"IBM Plex Mono"}
.badge.on{display:grid}
.search{margin-top:12px;display:flex;align-items:center;gap:9px;background:var(--cardb);border-radius:14px;padding:11px 13px}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:none}
.search input{border:0;outline:0;width:100%;background:transparent;font-size:14px;color:var(--ink)}

main{padding-bottom:calc(var(--tabh) + 30px);position:relative}
.view{display:none;animation:rise .28s ease both}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{padding:20px var(--pad) 0}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sechead h2{font-size:17px}
.link{color:var(--brand);font-size:13px;font-weight:600;background:0;border:0;cursor:pointer;padding:0;transition:color var(--T)}
.sub{color:var(--muted);font-size:13.5px;margin:0}

.banner{position:relative;margin:16px var(--pad) 0;border-radius:20px;padding:20px;color:#fff;overflow:hidden;
  background:var(--brand);transition:background-color var(--T)}
.banner .in{position:relative;z-index:2}
.banner h2{font-size:18px}
.banner p{margin:6px 0 13px;font-size:13px;opacity:.92}
.banner button{border:0;background:#fff;color:var(--brand);font-weight:700;font-size:13.5px;padding:10px 17px;
  border-radius:12px;cursor:pointer;transition:color var(--T)}

.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:0 var(--pad);margin-top:14px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow);transition:transform .18s;
  backdrop-filter:blur(8px)}
.cat:active{transform:scale(.96)}
.cat .ci{width:34px;height:34px;border-radius:11px;background:var(--brand-soft);display:grid;place-items:center;transition:background-color var(--T)}
body.dark .cat .ci{background:rgba(255,255,255,.08)}
.cat .ci svg{width:19px;height:19px;stroke:var(--brand);fill:none;stroke-width:1.6;transition:stroke var(--T)}
body.dark .cat .ci svg{stroke:var(--brand-3)}
.cat span{font-size:11.5px;font-weight:600;text-align:center}

.rail{display:flex;gap:12px;overflow-x:auto;padding:2px var(--pad) 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .prod{flex:none;width:158px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 var(--pad)}
.prod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:start;
  padding:0;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s;position:relative;display:block;width:100%;
  backdrop-filter:blur(8px)}
.prod:active{transform:scale(.985)}
.prod .art{background:var(--art);padding:14px 14px 6px;position:relative;transition:background-color var(--T)}
.prod .art svg{display:block;width:100%;height:98px}
.prod .art .photo{display:block;width:100%;height:104px;object-fit:cover;border-radius:9px}
.pill{position:absolute;top:9px;inset-inline-start:9px;background:var(--cardb);color:var(--brand);font-size:10.5px;
  font-weight:700;padding:3px 9px;border-radius:9px;box-shadow:var(--shadow);transition:color var(--T)}
.prod .meta{padding:10px 12px 12px}
.prod b{display:block;font-weight:700;font-size:13.5px}
.prod .desc{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.prod .buy{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.price{font-size:12px;color:var(--brand);font-weight:700;transition:color var(--T)}
body.dark .price,body.dark .link,body.dark .pill{color:var(--brand-3)}
.add{width:30px;height:30px;border-radius:10px;border:0;background:var(--brand);color:#fff;font-size:18px;line-height:1;
  display:grid;place-items:center;transition:background-color var(--T)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 var(--pad) 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 15px;
  font-size:13px;cursor:pointer;transition:background-color var(--T),border-color var(--T),color .2s}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.empty{text-align:center;padding:40px var(--pad);color:var(--muted)}
.empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px}

.scrim{position:fixed;inset:0;background:rgba(5,8,16,.6);z-index:60;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;background:var(--cardb);
  border-radius:24px 24px 0 0;padding:8px var(--pad) calc(18px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow:auto;
  border-top:1px solid var(--line)}
.sheet.on{transform:none}
.handle{width:42px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 12px}
.hero-art{background:var(--art);border-radius:16px;padding:16px;transition:background-color var(--T)}
.hero-art svg{display:block;width:100%;height:auto;max-height:190px}
.hero-art .photo{width:100%;max-height:230px;object-fit:cover;border-radius:12px;display:block}
.divider{height:1px;background:var(--line);margin:18px 0 14px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tag{background:var(--wash);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:11.5px;color:var(--muted)}
.opt{margin-top:16px}
.opt label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.ctrl{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:0;transition:.18s;color:var(--ink)}
.ctrl:focus-visible{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
textarea.ctrl{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:130px}
.stepper button{width:40px;height:42px;border:0;background:var(--wash);font-size:18px;cursor:pointer;color:var(--brand);transition:color var(--T)}
.stepper input{width:50px;text-align:center;border:0;outline:0;background:transparent;font-family:"IBM Plex Mono";color:var(--ink)}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:background-color var(--T),transform .15s}
.btn:active{transform:scale(.99)}
.btn-p{background:var(--brand);color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--brand) 35%,transparent)}
.btn-o{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn-wa{background:var(--green);color:#fff}
.acts{display:grid;gap:10px;margin-top:18px}

.line{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px;
  margin:0 var(--pad) 10px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.line .thumb{width:70px;height:70px;flex:none;border-radius:12px;background:var(--art);padding:8px;display:grid;place-items:center}
.line .thumb svg,.line .thumb .photo{width:100%;height:100%;object-fit:cover;border-radius:9px}
.line .body{flex:1;min-width:0}
.line b{display:block;font-weight:700;font-size:13.5px}
.line .spec{font-size:11.5px;color:var(--muted);margin-top:2px}
.line .ft{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.qty{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:2px 4px}
.qty button{border:0;background:0;color:var(--brand);font-size:16px;width:22px;cursor:pointer}
.qty span{font-family:"IBM Plex Mono";font-size:12.5px;min-width:16px;text-align:center}
.rm{border:0;background:0;color:#E2685A;font-size:12px;cursor:pointer}
.summary{margin:6px var(--pad) 0;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px}
.summary .r{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);padding:3px 0}
.summary .r b{color:var(--ink)}
.note{background:var(--brand-soft);border-radius:13px;padding:12px;font-size:12.5px;color:var(--brand-ink);
  margin:12px var(--pad) 0;transition:background-color var(--T),color var(--T)}
body.dark .note{background:rgba(255,255,255,.07);color:var(--brand-3)}
.err{display:none;color:#E2685A;font-size:12px;margin-top:6px}
.opt.bad .ctrl{border-color:#E2685A}
.opt.bad .err{display:block}

.info{margin:0 var(--pad);background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.info .item{display:flex;gap:12px;align-items:flex-start;padding:14px;border-bottom:1px solid var(--line)}
.info .item:last-child{border-bottom:0}
.info .ic{width:36px;height:36px;flex:none;border-radius:12px;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-size:16px;transition:background-color var(--T),color var(--T)}
body.dark .info .ic{background:rgba(255,255,255,.08);color:var(--brand-3)}
.info b{display:block;font-weight:700;font-size:13.5px}
.info span{font-size:12.5px;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px var(--pad) 0}

/* بطاقة إنستغرام */
.ig{display:flex;align-items:center;gap:12px;margin:16px var(--pad) 0;padding:14px;border-radius:20px;color:#fff;
  position:relative;overflow:hidden;transition:transform .15s;
  box-shadow:0 10px 26px rgba(214,36,159,.30);
  background:radial-gradient(circle at 22% 118%,#FDD85D 0%,#FD8C3D 22%,#FA4E6B 45%,#D6249F 66%,#5B51D8 92%)}
.ig::after{content:"";position:absolute;inset:-45% -12%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.26),transparent 62%);animation:igGlow 8s ease-in-out infinite}
@keyframes igGlow{0%,100%{transform:translate(-18%,10%)}50%{transform:translate(20%,-12%)}}
.ig:active{transform:scale(.99)}
.ig .igi{width:46px;height:46px;flex:none;border-radius:15px;display:grid;place-items:center;position:relative;z-index:2;
  background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45)}
.ig .igi svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ig .igt{flex:1;min-width:0;position:relative;z-index:2}
.ig .igt b{display:block;font-size:14.5px;font-weight:700;line-height:1.5}
.ig .igt .handle{display:block;font-family:"IBM Plex Mono",monospace;direction:ltr;unicode-bidi:isolate;
  font-size:13px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ig .go{width:20px;height:20px;flex:none;position:relative;z-index:2;opacity:.92}
[dir="rtl"] .ig .go{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.ig::after{animation:none}}

/* ===== زر الملف الشخصي العائم ===== */
.proffab{position:fixed;bottom:calc(var(--tabh) + 16px);inset-inline-end:max(16px,calc(50% - 244px));z-index:55;
  width:56px;height:56px;border:3px solid #fff;padding:0;border-radius:50%;cursor:pointer;overflow:hidden;
  background:var(--brand-soft);display:grid;place-items:center;transition:transform .18s,border-color var(--T);
  box-shadow:0 10px 26px color-mix(in srgb,var(--brand) 42%,transparent),0 0 0 1px rgba(255,255,255,.14)}
body.dark .proffab{border-color:var(--cardb)}
.proffab:active{transform:scale(.94)}
.proffab .pf-av{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--brand-soft)}
.proffab .pf-av img{width:100%;height:100%;object-fit:cover;display:block}
.proffab .pf-av svg{width:28px;height:28px;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* بطاقة فيسبوك — نفس شكل بطاقة إنستغرام بلون فيسبوك */
.ig.fb{box-shadow:0 10px 26px rgba(24,119,242,.30);
  background:linear-gradient(135deg,#2D88FF 0%,#1877F2 45%,#0A5DC2 100%)}
.steps{margin:0 var(--pad);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.step{display:flex;gap:11px;padding:7px 0}
.step i{width:23px;height:23px;flex:none;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-style:normal;
  font-family:"IBM Plex Mono";font-size:11px;display:grid;place-items:center;margin-top:3px}
body.dark .step i{background:rgba(255,255,255,.08);color:var(--brand-3)}
.step b{display:block;font-weight:700;font-size:13.5px}
.step span{font-size:12.5px;color:var(--muted)}

/* الإعدادات */
.setgrid{display:grid;gap:8px;margin-top:8px}
.setopt{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);
  background:var(--card);border-radius:13px;padding:13px 14px;cursor:pointer;transition:.18s;width:100%;text-align:start}
.setopt[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent)}
.setopt b{font-weight:700;font-size:14px}
.setopt small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.setopt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.setopt[aria-pressed="true"] .dot{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 3px var(--cardb)}
.setlabel{font-size:11.5px;letter-spacing:1.4px;color:var(--muted);margin:18px 0 2px;font-weight:600}

/* لوحة المالك — تبويب مخفي ما يبيّن إلا بعد الدخول */
#tab-admin{display:none}
body.owner #tab-admin{display:flex}
body.owner .tabbar{grid-template-columns:repeat(7,1fr)}
.adshot{width:100%;height:158px;border-radius:14px;background:var(--art);border:1px dashed var(--line);
  display:grid;place-items:center;overflow:hidden}
.adshot img{width:100%;height:100%;object-fit:cover;display:block}
.adbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.adtag{font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px;background:var(--brand-soft);color:var(--brand-ink)}
body.dark .adtag{background:rgba(255,255,255,.08);color:var(--brand-3)}
.adtag.warn{background:#FDF1DC;color:#7A4E06}
body.dark .adtag.warn{background:rgba(245,165,36,.16);color:var(--amber)}
.adtag.off{background:var(--wash);color:var(--muted)}

.tabbar{position:fixed;bottom:0;inset-inline:0;z-index:50;max-width:520px;margin:0 auto;height:var(--tabh);
  padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(6,1fr);
  background:color-mix(in srgb,var(--cardb) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{border:0;background:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:11px;cursor:pointer;position:relative;transition:color var(--T)}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--brand);font-weight:700}
body.dark .tab[aria-selected="true"]{color:var(--brand-3)}
.tab .cb{position:absolute;top:6px;inset-inline-start:calc(50% + 6px);min-width:17px;height:17px;border-radius:99px;
  background:var(--amber);color:#3A2500;font-size:10px;font-weight:700;display:none;place-items:center;padding:0 4px;font-family:"IBM Plex Mono"}
.tab .cb.on{display:grid}
.toast{position:fixed;bottom:calc(var(--tabh) + 18px);inset-inline:0;margin:0 auto;width:max-content;max-width:88%;
  background:#0F1724;color:#fff;border-radius:12px;padding:11px 16px;font-size:13px;z-index:70;opacity:0;
  transform:translateY(8px);pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:var(--shadow-lg)}
body.dark .toast{background:#1D2740;border:1px solid var(--line)}
.toast.on{opacity:1;transform:none}
.foot{text-align:center;color:var(--muted);font-size:11.5px;padding:24px var(--pad) 12px}
.reportlink{border:0;background:0;color:var(--brand);font-family:inherit;font-size:11.5px;cursor:pointer;
  text-decoration:underline;padding:6px 0}
body.dark .reportlink{color:var(--brand-3)}
.devline{display:block;margin-top:6px;color:var(--muted);font-size:11px}
.devline b{color:#C39A4E}

.credit{margin:6px var(--pad) 0;background:linear-gradient(170deg,#FFFFFF,#FBF7EF);border:1px solid #EADFC6;
  border-radius:20px;padding:20px 16px 18px;text-align:center;box-shadow:var(--shadow)}
body.dark .credit{background:linear-gradient(170deg,#141A28,#0D121C);border-color:#3A3122}
.credit img{width:min(180px,52%);height:auto;display:block;margin:0 auto 12px;border-radius:12px}
.credit .kicker{font-size:10.5px;letter-spacing:2px;color:#B08A45;margin-bottom:8px}
.credit b{display:block;font-family:"Reem Kufi",serif;font-weight:600;font-size:15.5px;color:var(--ink);line-height:1.6}
.credit .gold{display:block;font-family:"Reem Kufi",serif;font-weight:600;font-size:14.5px;line-height:1.7;
  background:linear-gradient(90deg,#B98B37,#E7C87C,#B98B37);-webkit-background-clip:text;background-clip:text;color:transparent}
.credit .motto{display:block;font-size:12.5px;color:#9A8763;margin-top:6px}
.credit .hr{height:1px;background:linear-gradient(90deg,transparent,#E2D2AE,transparent);margin:14px 0}
.credit .wa{display:inline-flex;align-items:center;gap:8px;background:#12A150;color:#fff;border-radius:12px;
  padding:11px 18px;font-weight:700;font-size:13.5px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.blob{animation:none}*{transition-duration:.2s!important}}

/* ═══ الملف الشخصي: الصورة + البريد ═══ */
.avwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
.av{position:relative;width:104px;height:104px;border-radius:50%;flex:none;background:var(--brand-soft);
  display:grid;place-items:center;overflow:hidden;border:3px solid var(--brand);
  box-shadow:0 10px 26px color-mix(in srgb,var(--brand) 30%,transparent);transition:border-color var(--T),background-color var(--T)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av .ini{font-size:34px;font-weight:700;color:var(--brand);line-height:1;transition:color var(--T)}
.av .cam{position:absolute;inset-inline-end:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;border:3px solid var(--cardb);
  background:var(--brand);display:grid;place-items:center;cursor:pointer;transition:background-color var(--T)}
.av .cam svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.avmini{width:46px;height:46px;border-radius:50%;flex:none;overflow:hidden;background:var(--brand-soft);
  display:grid;place-items:center;border:2px solid var(--brand);transition:border-color var(--T),background-color var(--T)}
.avmini img{width:100%;height:100%;object-fit:cover;display:block}
.avmini .ini{font-size:17px;font-weight:700;color:var(--brand)}
.avhint{font-size:11.5px;color:var(--muted);text-align:center}
.avdel{background:0;border:0;color:#E2685A;font-size:12px;font-weight:600;cursor:pointer;padding:2px 6px}
.fieldwrap{position:relative}
.fieldwrap .ctrl{padding-inline-end:40px}
.fmark{position:absolute;inset-inline-end:13px;top:50%;transform:translateY(-50%);font-size:15px;line-height:1;
  opacity:0;transition:opacity .2s}
.fmark.on{opacity:1}
.hint{display:flex;align-items:flex-start;gap:7px;font-size:12px;margin-top:7px;line-height:1.6}
.hint.ok{color:var(--green)}
.hint.warn{color:var(--amber)}
.hint.bad{color:#E2685A}
.hint.mute{color:var(--muted)}
.fixbtn{background:var(--brand-soft);color:var(--brand-ink);border:1px solid color-mix(in srgb,var(--brand) 30%,transparent);
  border-radius:9px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;margin-inline-start:4px;
  font-family:inherit;transition:background-color var(--T),color var(--T)}
.fixbtn:active{transform:scale(.97)}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--brand);
  display:inline-block;animation:sp .7s linear infinite;flex:none;margin-top:3px}
@keyframes sp{to{transform:rotate(360deg)}}
.lockrow{display:flex;align-items:center;gap:9px;background:var(--wash);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;margin-top:8px}
.lockrow svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:none}
.lockrow b{font-size:13.5px}
.lockrow small{display:block;font-size:11px;color:var(--muted)}

/* ═══════════ نظام المراسلات ═══════════ */
.msg-list{padding:0 var(--pad)}
.msg-conv{display:flex;gap:11px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.msg-conv:last-child{border-bottom:0}
.msg-conv:active{opacity:.7}
.msg-av{width:48px;height:48px;border-radius:50%;flex:none;background:var(--brand-soft);display:grid;place-items:center;overflow:hidden;
  border:2px solid var(--line);transition:border-color var(--T)}
.msg-av img{width:100%;height:100%;object-fit:cover}
.msg-av .ini{font-size:18px;font-weight:700;color:var(--brand)}
.msg-body{flex:1;min-width:0}
.msg-body b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-body .msg-preview{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.msg-time{font-size:11px;color:var(--muted);flex:none;font-family:"IBM Plex Mono";align-self:flex-start;margin-top:2px}
.msg-unread{min-width:20px;height:20px;border-radius:99px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;
  display:grid;place-items:center;padding:0 5px;flex:none;font-family:"IBM Plex Mono"}

/* شاشة المحادثة */
.chat-screen{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;max-width:520px;margin:0 auto;transition:background-color var(--T)}
.chat-screen.on{display:flex}
.chat-top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
  background:var(--brand);color:#fff;border-radius:0 0 18px 18px;flex:none;
  box-shadow:0 4px 16px color-mix(in srgb,var(--brand) 30%,transparent)}
.chat-back{width:36px;height:36px;border:0;border-radius:11px;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.chat-back svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chat-top .msg-av{width:38px;height:38px;border-color:rgba(255,255,255,.3)}
.chat-top .msg-av .ini{color:#fff;font-size:14px}
.chat-top-info{flex:1;min-width:0}
.chat-top-info b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-top-info small{font-size:11px;opacity:.8}
.chat-follow-btn{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;border-radius:10px;
  padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;flex:none;transition:.15s}
.chat-follow-btn.following{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.6)}
.chat-follow-btn:active{transform:scale(.95)}

/* فقاعات الرسائل */
.chat-msgs{flex:1;overflow-y:auto;padding:14px var(--pad);display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.chat-bubble{max-width:82%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.65;word-break:break-word;position:relative}
.chat-bubble.me{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-left-radius:16px;border-bottom-right-radius:6px}
.chat-bubble.them{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-right-radius:16px;border-bottom-left-radius:6px}
.chat-bubble .chat-img{max-width:100%;border-radius:10px;margin-bottom:4px;display:block;cursor:pointer}
.chat-img-wrap{position:relative;display:inline-block}
.chat-img-dl{position:absolute;bottom:10px;inset-inline-end:8px;width:30px;height:30px;border-radius:50%;
  background:rgba(0,0,0,.55);border:0;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(2px)}
.chat-img-dl svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chat-img-dl:active{transform:scale(.9)}
.uprof-av-lg{width:88px!important;height:88px!important}
.uprof-av-lg .ini{font-size:30px!important}
.chat-bubble .chat-ts{font-size:10px;opacity:.6;margin-top:3px;text-align:end;font-family:"IBM Plex Mono"}
.chat-date{text-align:center;font-size:11px;color:var(--muted);padding:8px 0}

/* حقل الإدخال */
.chat-input{display:flex;align-items:flex-end;gap:8px;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 10px);
  background:var(--cardb);border-top:1px solid var(--line);flex:none}
.chat-input textarea{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 13px;
  font-size:14px;color:var(--ink);resize:none;outline:0;max-height:100px;min-height:42px;line-height:1.5;
  transition:border-color .15s}
.chat-input textarea:focus{border-color:var(--brand)}
.chat-img-btn,.chat-send-btn{width:40px;height:40px;border:0;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.chat-img-btn{background:var(--brand-soft);color:var(--brand)}
.chat-img-btn svg,.chat-send-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chat-send-btn{background:var(--brand);color:#fff}
.chat-send-btn:active{transform:scale(.93)}
.chat-img-preview{position:relative;margin:8px 12px 0;display:none}
.chat-img-preview img{max-height:120px;border-radius:10px;display:block}
.chat-img-preview .chat-img-x{position:absolute;top:-6px;inset-inline-end:-6px;width:24px;height:24px;border-radius:50%;
  background:#E2685A;color:#fff;border:0;font-size:14px;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}

/* قائمة المتابعين */
.follow-list{padding:0 var(--pad)}
.follow-item{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.follow-item:last-child{border-bottom:0}
.follow-item .msg-av{width:42px;height:42px}
.follow-item b{font-size:13.5px;flex:1}
.follow-btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:10px;
  padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;flex:none;transition:.15s}
.follow-btn.off{background:transparent;color:var(--brand)}
.follow-btn:active{transform:scale(.95)}

/* البحث عن مستخدمين */
.user-search{margin:12px var(--pad) 0;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:10px 13px}
.user-search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:none}
.user-search input{border:0;outline:0;width:100%;background:transparent;font-size:14px;color:var(--ink)}

/* تبويبات المراسلات */
.msg-tabs{display:flex;gap:0;margin:12px var(--pad) 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.msg-tab{flex:1;border:0;background:var(--card);color:var(--muted);padding:10px;font-size:13px;font-weight:600;cursor:pointer;
  transition:background .15s,color .15s}
.msg-tab.on{background:var(--brand);color:#fff}

/* الحالة الفارغة */
.msg-empty{text-align:center;padding:40px var(--pad);color:var(--muted)}
.msg-empty svg{width:48px;height:48px;stroke:var(--line);fill:none;stroke-width:1.2;margin-bottom:10px}
.msg-empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px}

/* علامة التوثيق */
.verified-badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;
  background:#1DA1F2;margin-inline-start:4px;vertical-align:middle;flex:none}
.verified-badge svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.verified-badge.lg{width:18px;height:18px}
.verified-badge.lg svg{width:12px;height:12px}

/* يوزرنيم */
.username-tag{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);direction:ltr;unicode-bidi:isolate}

/* زر + المراسلة على صورة المالك بالريلز */
.rl-msg-btn{position:absolute;bottom:-14px;inset-inline-start:50%;transform:translateX(-50%);z-index:6;
  width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;border:2px solid #fff;
  display:grid;place-items:center;cursor:pointer;font-size:18px;font-weight:700;line-height:1;
  box-shadow:0 2px 8px rgba(0,0,0,.3);transition:transform .15s}
.rl-msg-btn:active{transform:translateX(-50%) scale(.9)}
.rl-logo-wrap{position:relative;display:inline-block}
</style>

const sky=document.getElementById('sky'), sx=sky.getContext('2d');
let stars=[], planets=[], shoot=null, skyRAF=null;
function initSky(){
  const dpr=Math.min(2,devicePixelRatio||1);
  sky.width=innerWidth*dpr; sky.height=innerHeight*dpr; sky.style.width=innerWidth+'px'; sky.style.height=innerHeight+'px';
  sx.setTransform(dpr,0,0,dpr,0,0);
  stars=[]; const n=Math.round(innerWidth*innerHeight/5200);
  for(let i=0;i<n;i++) stars.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.3+.3,
    a:Math.random(),sp:.004+Math.random()*.012,dx:(Math.random()-.5)*.02});
  planets=[
   {x:innerWidth*.18,y:innerHeight*.20,r:34,c1:"#6E86FF",c2:"#2A3A8C",ring:0,vx:.012,vy:.006},
   {x:innerWidth*.80,y:innerHeight*.42,r:22,c1:"#F2B36B",c2:"#8A5A22",ring:1,vx:-.010,vy:.008},
   {x:innerWidth*.55,y:innerHeight*.78,r:15,c1:"#8CE0D0",c2:"#1E6A61",ring:0,vx:.008,vy:-.007}
  ];
}
function drawSky(){
  const w=innerWidth,h=innerHeight;
  const bg=sx.createLinearGradient(0,0,w,h);
  bg.addColorStop(0,"#070B16"); bg.addColorStop(.5,"#0A1122"); bg.addColorStop(1,"#05070F");
  sx.fillStyle=bg; sx.fillRect(0,0,w,h);
  const neb=sx.createRadialGradient(w*.75,h*.25,10,w*.75,h*.25,Math.max(w,h)*.6);
  neb.addColorStop(0,"rgba(90,70,200,.18)"); neb.addColorStop(1,"rgba(0,0,0,0)");
  sx.fillStyle=neb; sx.fillRect(0,0,w,h);
  planets.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<-60)p.x=w+60; if(p.x>w+60)p.x=-60; if(p.y<-60)p.y=h+60; if(p.y>h+60)p.y=-60;
    if(p.ring){sx.save();sx.translate(p.x,p.y);sx.rotate(-.42);sx.strokeStyle="rgba(240,210,160,.45)";sx.lineWidth=2.4;
      sx.beginPath();sx.ellipse(0,0,p.r*1.9,p.r*.55,0,0,7);sx.stroke();sx.restore()}
    const g=sx.createRadialGradient(p.x-p.r*.35,p.y-p.r*.35,p.r*.15,p.x,p.y,p.r);
    g.addColorStop(0,p.c1); g.addColorStop(1,p.c2);
    sx.fillStyle=g; sx.beginPath(); sx.arc(p.x,p.y,p.r,0,7); sx.fill();
    sx.fillStyle="rgba(255,255,255,.06)"; sx.beginPath(); sx.arc(p.x,p.y,p.r*1.35,0,7); sx.fill();
  });
  stars.forEach(s=>{
    s.a+=s.sp; s.x+=s.dx; if(s.x<0)s.x=w; if(s.x>w)s.x=0;
    const al=.35+Math.abs(Math.sin(s.a))*.65;
    sx.globalAlpha=al; sx.fillStyle="#fff";
    sx.beginPath(); sx.arc(s.x,s.y,s.r,0,7); sx.fill();
  });
  sx.globalAlpha=1;
  if(!shoot&&Math.random()<.004) shoot={x:Math.random()*w*.7,y:Math.random()*h*.4,l:0};
  if(shoot){
    shoot.l+=9; shoot.x+=7; shoot.y+=4;
    const grad=sx.createLinearGradient(shoot.x,shoot.y,shoot.x-70,shoot.y-40);
    grad.addColorStop(0,"rgba(255,255,255,.9)"); grad.addColorStop(1,"rgba(255,255,255,0)");
    sx.strokeStyle=grad; sx.lineWidth=2; sx.beginPath(); sx.moveTo(shoot.x,shoot.y); sx.lineTo(shoot.x-70,shoot.y-40); sx.stroke();
    if(shoot.l>260) shoot=null;
  }
  skyRAF=requestAnimationFrame(drawSky);
}
function setTheme(d){
  dark=d; document.body.classList.toggle('dark',d); persist();
  applyPalette(PALETTES[pi]);
  if(d){ initSky(); if(!skyRAF) drawSky(); }
  else { if(skyRAF){cancelAnimationFrame(skyRAF);skyRAF=null} sx.clearRect(0,0,sky.width,sky.height) }
}
addEventListener('resize',()=>{ if(dark) initSky() });

let _uid=0;
function frameSVG(m,big){
  const u="u"+(++_uid);
  const W=200,H=Math.max(70,Math.round(200*(m.h/m.w))),pad=8;
  const iw=W-pad*2, ih=H-pad*2;
  const arch=m.arch?Math.min(34,iw*0.22):0;
  const topH=m.glassTop?ih*0.24:0;
  const bY=pad+topH+arch, bH=ih-topH-arch;
  const cols=m.cols||1, cw=iw/cols;
  const glass=m.frosted?`url(#fr${u})`:`url(#gl${u})`;
  let g="";
  const panel=(x,y,w,h,type)=>{
    let o=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="${type==='solid'?`url(#al${u})`:glass}" stroke="#8A97A9" stroke-width="1.3"/>`;
    if(type==='glass'||type==='frost')
      o+=`<path d="M${x+w*.10} ${y+h} L${x+w*.52} ${y} L${x+w*.74} ${y} L${x+w*.32} ${y+h} Z" fill="#fff" opacity=".30"/>
          <path d="M${x+w*.62} ${y+h} L${x+w*.92} ${y} L${x+w*.99} ${y} L${x+w*.69} ${y+h} Z" fill="#fff" opacity=".16"/>`;
    if(type==='solid') for(let k=1;k<4;k++) o+=`<path d="M${x} ${y+h*k/4} h${w}" stroke="#9DA9B9" stroke-width="1" opacity=".8"/>`;
    if(type==='mesh') o+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#ms${u})"/>`;
    return o;
  };
  const handleV=(x,y,h)=>`<rect x="${x-1.6}" y="${y+h*.42}" width="3.2" height="${Math.min(28,h*.18)}" rx="1.6" fill="#6E7A8C"/>`;
  const hinges=(x,y,h)=>[.18,.5,.82].map(k=>`<rect x="${x-2}" y="${y+h*k-4}" width="4" height="8" rx="1.5" fill="#7A8698"/>`).join("");
  const arrow=(cx,cy,dir)=>`<path d="M${cx-11*dir} ${cy} h${22*dir} M${cx+11*dir} ${cy} l${-5*dir} -4 M${cx+11*dir} ${cy} l${-5*dir} 4" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
  for(let i=0;i<cols;i++){
    const x=pad+i*cw+3, y=bY+3, w=cw-6, h=bH-6;
    const isSolid=i<(m.solid||0), isMesh=m.mesh&&i===cols-1;
    const type=isSolid?'solid':(isMesh?'mesh':(m.frosted?'frost':'glass'));
    g+=panel(x,y,w,h,type);
    const cx=x+w/2, cy=y+h/2;
    if(m.slide&&!isSolid&&!isMesh&&!(m.halffixed&&i===0)) g+=arrow(cx,cy,1);
    if(m.auto) g+=arrow(cx,cy,i===0?-1:1);
    if(m.fold) g+=`<path d="M${x+w*.5} ${y} v${h}" stroke="#9DA9B9" stroke-width="1" stroke-dasharray="3 3"/>`;
    if(m.project&&i===0) g+=`<path d="M${x+4} ${y+h-6} L${cx} ${y+6} L${x+w-4} ${y+h-6}" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
    if(m.hinge==='both'){ if(i===0){g+=handleV(x+w-4,y,h);g+=hinges(x+1,y,h)} else {g+=handleV(x+4,y,h);g+=hinges(x+w-1,y,h)} }
    else if(m.hinge&&i===cols-1){ g+=handleV(x+6,y,h); g+=hinges(x+w-1,y,h) }
    if(m.guard) for(let k=1;k<5;k++) g+=`<path d="M${x+w*k/5} ${y} v${h}" stroke="#9DA9B9" stroke-width="1.2" opacity=".9"/>`;
    if(m.halffixed&&i===0) g+=`<circle cx="${cx}" cy="${cy}" r="2.4" fill="#9DA9B9"/>`;
  }
  if(m.glassTop) g+=panel(pad+3,pad+arch+3,iw-6,topH-6,'glass');
  if(m.auto) g+=`<rect x="${pad+iw/2-9}" y="${pad-5}" width="18" height="4" rx="2" fill="currentColor"/>`;
  const outer=arch
    ? `<path d="M${pad} ${H-pad} V${pad+arch} A${iw/2} ${arch} 0 0 1 ${W-pad} ${pad+arch} V${H-pad} Z" fill="url(#al${u})" stroke="#7F8C9E" stroke-width="2"/>`
    : `<rect x="${pad}" y="${pad}" width="${iw}" height="${ih}" rx="3" fill="url(#al${u})" stroke="#7F8C9E" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${m.n[li()]}"
      style="color:var(--brand);transition:color var(--T)">
    <defs>
      <linearGradient id="al${u}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#F4F7FA"/><stop offset=".45" stop-color="#D2DAE4"/>
        <stop offset=".55" stop-color="#C2CBD8"/><stop offset="1" stop-color="#A7B2C1"/></linearGradient>
      <linearGradient id="gl${u}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#DCEAF4"/><stop offset=".5" stop-color="#C6DCEC"/><stop offset="1" stop-color="#B3D0E3"/></linearGradient>
      <linearGradient id="fr${u}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#E4EDF3"/><stop offset="1" stop-color="#CFDDE6"/></linearGradient>
      <pattern id="ms${u}" width="3.5" height="3.5" patternUnits="userSpaceOnUse">
        <path d="M0 0H3.5M0 0V3.5" stroke="#7F8C9E" stroke-width=".5" opacity=".75"/></pattern>
    </defs>
    ${outer}${g}
    <rect x="${pad+2}" y="${pad+2}" width="${iw-4}" height="${ih-4}" rx="2" fill="none" stroke="#fff" stroke-width="1" opacity=".45"/>
  </svg>`;
}
const art=(m,big)=>m.img?`<img src="${esc(m.img)}" alt="${esc(m.n[li()])}" loading="lazy" class="photo${big?' big':''}">`:frameSVG(m,big);

function renderShop(){
  const i=li();
  let list=MODELS.filter(m=>filter==="all"||m.c===filter);
  if(query){const q=query.toLowerCase();
    list=list.filter(m=>(m.n[i]+m.s[i]+m.d[i]+m.t[i].join(" ")+catName(m.c)).toLowerCase().includes(q));}
  document.getElementById('grid').innerHTML=list.map(prodHTML).join('');
  document.getElementById('empty').hidden=list.length>0;
  document.getElementById('count').textContent=list.length+" "+t().countSuffix;
  document.getElementById('shop-title').textContent=filter==="all"?t().allProducts:catName(filter);
  document.querySelectorAll('[data-chip]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.chip===filter));

function renderAll(){
  const i=li();
  document.getElementById('cats').innerHTML=CATS.map(c=>
    `<button class="cat" data-cat="${c.k}"><span class="ci"><svg viewBox="0 0 24 24"><path d="${c.p}"/></svg></span><span>${c.n[i]}</span></button>`).join('');
  const hotL=MODELS.filter(m=>m.hot), newL=MODELS.filter(m=>m.newy).slice(0,4);
  document.getElementById('rail').innerHTML=hotL.map(prodHTML).join('');
  document.getElementById('new-grid').innerHTML=newL.map(prodHTML).join('');
  /* إذا ما بيها منتجات: نخفي الأقسام الفاضية ونبيّن ملاحظة بدالها */
  const hid=(id,v)=>{const el=document.getElementById(id); if(el) el.hidden=v};
  hid('sec-hot',!hotL.length); hid('rail',!hotL.length);
  hid('sec-new',!newL.length);
  hid('home-empty',MODELS.length>0);
  document.getElementById('chips').innerHTML=[{k:"all",n:t().all}].concat(CATS.map(c=>({k:c.k,n:c.n[i]})))
    .map(c=>`<button class="chip" aria-pressed="${c.k===filter}" data-chip="${c.k}">${c.n}</button>`).join('');
  document.getElementById('steps').innerHTML=t().steps.map((s,k)=>
    `<div class="step"><i>${k+1}</i><div><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join('');
  renderShop(); renderCart();
}

function readAvatar(file,done){
  const x=t();
  if(!file) return;
  if(!/^image\//i.test(file.type||"")){ toast(x.avBad); return }
  if(file.size>15*1024*1024){ toast(x.avBig); return }
  const fr=new FileReader();
  fr.onerror=()=>toast(x.avBad);
  fr.onload=()=>{
    const img=new Image();
    img.onerror=()=>toast(x.avBad);
    img.onload=()=>{
      try{
        const S=320, c=document.createElement('canvas'); c.width=S; c.height=S;
        const g=c.getContext('2d'), side=Math.min(img.width,img.height);
        g.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);
        let q=.82, out=c.toDataURL("image/jpeg",q);
        while(out.length>190000&&q>.38){ q-=.12; out=c.toDataURL("image/jpeg",q) }
        done(out);
      }catch(e){ toast(x.avBad) }
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

/* ══════════════ التحقّق الذكي من البريد ══════════════

   ٥) فحص حيّ للنطاق عبر DNS: هل يستقبل بريد فعلاً؟          */
const POPULAR=["gmail.com","googlemail.com","yahoo.com","yahoo.co.uk","hotmail.com","hotmail.co.uk",
  "outlook.com","outlook.sa","live.com","msn.com","icloud.com","me.com","aol.com","proton.me",

  "yopmail.com","sharklasers.com","trashmail.com","throwawaymail.com","getnada.com","maildrop.cc",

  "mohmal.com","tmpmail.org","spam4.me","mailcatch.com","minuteinbox.com","1secmail.com"];

  "webmaster","postmaster","office","team","billing"];
/* امتدادات غلط شائعة — ‎.co‎ و‎.cm‎ مو موجودة هنا لأنهن امتدادات حقيقية */
const TLD_FIX={con:"com",cpm:"com",cmo:"com",ocm:"com",comm:"com",vom:"com",xom:"com",clm:"com",
  cim:"com",coom:"com",ney:"net",nte:"net",ner:"net",ogr:"org",orh:"org",prg:"org"};

function emailClean(raw){
  let s=String(raw||"");
  s=s.replace(/[\u200B-\u200F\u202A-\u202E\uFEFF]/g,"");                 /* رموز اتجاه مخفية */
  s=s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
     .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));                     /* أرقام عربية/فارسية */
  s=s.replace(/[＠﹫]/g,"@").replace(/[。｡]/g,".").replace(/[،؛]/g,".");
  return s.replace(/\s+/g,"").toLowerCase();
}
function lev(a,b){                                                       /* مسافة التحرير */
  if(a===b) return 0;
  const m=a.length,n=b.length; if(!m||!n) return m||n;
  let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev]; }
  return prev[n];
}
function nearDomain(d){
  if(POPULAR.indexOf(d)>-1) return null;
  let best=null,bd=9;
  POPULAR.forEach(p=>{ const k=lev(d,p); if(k<bd){bd=k;best=p} });
  const lim = bd<=1 ? 1 : (best&&best.length>=9 ? 2 : 1);
  return (best&&bd<=lim&&bd>0)?best:null;
}
/* يرجّع {s:الحالة, m:النص, fix:الاقتراح} — الحالات: empty|bad|fix|warn|ok */
function emailCheck(raw){
  const x=t(), v=emailClean(raw);
  if(!v) return {s:"empty",m:x.emailHint};
  if(/[\u0600-\u06FF]/.test(v)) return {s:"bad",m:x.emAr};
  if(/\s/.test(String(raw))&&!/@/.test(v)) return {s:"bad",m:x.emSpace};
  if(v.length>254) return {s:"bad",m:x.emLong};
  const at=v.split("@").length-1;
  if(at===0) return {s:"bad",m:x.emAt};
  if(at>1)  return {s:"bad",m:x.emAt2};
  const i=v.lastIndexOf("@"), loc=v.slice(0,i); let dom=v.slice(i+1);
  if(!loc||loc.length>64||!/^[a-z0-9.!#$%&'*+/=?^_`{|}~-]+$/.test(loc)) return {s:"bad",m:x.emLocal};
  if(loc.startsWith(".")||loc.endsWith(".")) return {s:"bad",m:x.emEdge};
  if(loc.indexOf("..")>-1) return {s:"bad",m:x.emDot};
  if(!dom) return {s:"bad",m:x.emDom};
  dom=dom.replace(/\.+$/,"");
  if(dom.indexOf("..")>-1) return {s:"bad",m:x.emDot};
  if(dom.indexOf(".")<0){                       /* نسى النقطة: gmailcom → gmail.com */
    const g=POPULAR.find(p=>p.replace(".","")===dom);
    return {s:"bad",m:x.emDom,fix:g?loc+"@"+g:null};
  }
  const labs=dom.split(".");
  for(const l of labs){
    if(!l||l.length>63||!/^[a-z0-9-]+$/.test(l)||l.startsWith("-")||l.endsWith("-"))
      return {s:"bad",m:x.emDom};
  }
  const tld=labs[labs.length-1];
  if(!/^[a-z]{2,24}$/.test(tld)) return {s:"bad",m:x.emTld};
  /* اقتراح تصحيح: ما يمنع الحفظ — الزبون يقرر، وفحص الـDNS يجي بعده */
  if(TLD_FIX[tld])
    return {s:"fix",m:x.emDid,fix:loc+"@"+labs.slice(0,-1).join(".")+"."+TLD_FIX[tld],v:loc+"@"+dom,dom};
  const near=nearDomain(dom);
  if(near) return {s:"fix",m:x.emDid,fix:loc+"@"+near,v:loc+"@"+dom,dom};
  if(TEMP_MAIL.indexOf(dom)>-1) return {s:"warn",m:x.emTemp,v:loc+"@"+dom,dom};
  if(ROLE_BOX.indexOf(loc.split("+")[0])>-1) return {s:"warn",m:x.emRole,v:loc+"@"+dom,dom};
  if(dom==="gmail.com"||dom==="googlemail.com"){
    const base=loc.split("+")[0].replace(/\./g,"");
    if(!/^[a-z0-9]{6,30}$/.test(base)) return {s:"warn",m:x.emGmailShort,v:loc+"@"+dom,dom};
  }
  return {s:"ok",m:x.emOk,v:loc+"@"+dom,dom};
}
/* فحص النطاق بالـ DNS-over-HTTPS — يشتغل بدون سيرفر، وإذا ما وصل ينتجاهل بهدوء */
const mxMemo=new Map();
async function domainLive(dom){
  if(mxMemo.has(dom)) return mxMemo.get(dom);
  const ask=async(url,head)=>{
    const c=new AbortController(), tm=setTimeout(()=>c.abort(),6500);
    try{ const r=await fetch(url,{signal:c.signal,headers:head||{}});
         if(!r.ok) throw new Error("dns"); return await r.json() }
    finally{ clearTimeout(tm) }
  };
  const read=(j,type)=>{
    if(!j) return null;
    if(j.Status===3) return "nodomain";
    if(j.Status!==0) return null;
    return ((j.Answer||[]).some(a=>a.type===type))?"yes":"no";
  };
  let out="unknown";
  try{
    const q=encodeURIComponent(dom);
    let mx=null;
    try{ mx=read(await ask("https://cloudflare-dns.com/dns-query?name="+q+"&type=MX",{accept:"application/dns-json"}),15) }
    catch(e){ mx=read(await ask("https://dns.google/resolve?name="+q+"&type=MX"),15) }
    if(mx==="yes") out="mx";
    else if(mx==="nodomain") out="nodomain";
    else if(mx==="no"){
      let a=null;
      try{ a=read(await ask("https://cloudflare-dns.com/dns-query?name="+q+"&type=A",{accept:"application/dns-json"}),1) }
      catch(e){ a=null }
      out = a==="yes" ? "nomx" : a==="nodomain" ? "nodomain" : "unknown";
    }
  }catch(e){ out="unknown" }                     /* ما توفر إنترنت/محجوب → ننتجاهل */
  mxMemo.set(dom,out);
  return out;
}
/* يربط حقل بريد بالفحص الحيّ: علامة ✓/✕ + سطر توضيح + زر تصحيح */
function bindEmail(inp,hint,mark,after){
  let timer=null, seq=0;
  const qm=()=>t().dir==="rtl"?"؟":"?";
  const paint=(cls,msg,markTxt,fix,busy)=>{
    hint.className="hint "+cls;
    hint.innerHTML=(busy?`<span class="spin"></span>`:``)
      +`<span>${esc(msg)}${fix?` <b class="mono">${esc(fix)}</b>${qm()}`:``}</span>`
      +(fix?`<button class="fixbtn" id="em-fix">${esc(t().emFix)}</button>`:``);
    mark.textContent=markTxt||"";
    mark.classList.toggle("on",!!markTxt);
    mark.style.color = cls==="ok"?"var(--green)" : cls==="bad"?"#E2685A" : cls==="warn"?"var(--amber)":"var(--muted)";
    const b=hint.querySelector("#em-fix");
    if(b&&fix) b.onclick=()=>{ inp.value=fix; run(true) };
  };
  const tell=(val,good)=>{ profile.emailOk=!!good; after&&after(good?val:"",!!good) };
  function run(deep){
    const x=t(), r=emailCheck(inp.value), my=++seq;
    if(r.s==="empty"){ paint("mute",x.emailHint,""); tell("",false); return }
    if(r.s==="bad"){ paint("bad",r.m,"✕",r.fix); tell("",false); return }   /* غلط بنيوي → يمنع */
    const cls = r.s==="ok" ? "ok" : "warn";
    const base= r.s==="fix" ? x.emDid : r.m;                                /* اقتراح/تنبيه → ما يمنع */
    paint(cls,base,cls==="ok"?"✓":"!",r.fix);
    tell(r.v||"",true);
    if(!deep||!r.dom) return;
    paint("mute",x.emChecking,"",null,true);                                /* فحص حيّ للنطاق */
    domainLive(r.dom).then(st=>{
      if(my!==seq) return;                                   /* المستخدم كتب شي جديد */
      const y=t();
      if(st==="nodomain"){ paint("bad",y.emNoDom,"✕",r.fix); tell("",false); return }
      if(st==="nomx"){ paint("warn",y.emNoMx,"!",r.fix); return }
      if(st==="mx"&&r.s==="ok"){ paint("ok",y.emLive,"✓"); return }
      paint(cls,base,cls==="ok"?"✓":"!",r.fix);              /* ما وصل الفحص — نكتفي بالشكل */
    });
  }
  inp.addEventListener('input',()=>{ clearTimeout(timer); run(false); timer=setTimeout(()=>run(true),750) });
  inp.addEventListener('blur',()=>{ const c=emailClean(inp.value); if(c!==inp.value) inp.value=c; run(true) });
  run(!!inp.value.trim());
}

/* ═══════════ حساب الزبون والنقاط ═══════════ */
let member=null;                       /* {phone,name,area,points} */
const LS_MEM="ha_member_v1";
const fmt=n=>(+n||0).toLocaleString("en-US");
const okPhone=v=>/^07\d{9}$/.test(String(v).replace(/\s/g,""));
const okPin=v=>/^\d{4,6}$/.test(String(v).trim());

function memberSave(m,pin){ member=m; lsSet(LS_MEM,{phone:m.phone,pin,name:m.name}); renderAcct() }
function memberOut(){ member=null; lsDel(LS_MEM); renderAcct(); toast(t().tLoggedOut) }
const noteTxt=()=>t().memberNote;
function memberPin(){ const d=lsGet(LS_MEM); return d&&d.pin?d.pin:null }

async function memberRefresh(){                 /* يجدّد بيانات الحساب */
  const d=lsGet(LS_MEM); if(!d||!d.phone||!d.pin) return;
  try{
    const r=await sbRpc("customer_login",{p_phone:d.phone,p_pin:d.pin});
    if(r&&r[0]){ member=r[0]; renderAcct() }
  }catch(e){ console.warn("[member] refresh:",e) }
}
async function memberBoot(){
  const d=lsGet(LS_MEM);
  if(!d||!d.phone||!d.pin){ renderAcct(); return }
  await memberRefresh();
  if(member){ if(!customer.name&&member.name) customer.name=member.name;
    if(!customer.phone) customer.phone=member.phone;
    if(!customer.area&&member.area) customer.area=member.area; persist() }
  renderAcct();
}
const rpcWhy=(e,x)=>{ const m=String(e&&e.message||e);
  if(m.includes("exists")) return x.errExists;
  if(m.includes("bad_login")) return x.errLogin;
  if(m.includes("bad_phone")) return x.errP;
  if(m.includes("bad_pin")) return x.errPin;
  if(m.includes("PGRST202")||m.includes("404")) return x.errFn;      /* الدوال ما انضافت */
  if(m.includes("Failed to fetch")||m.includes("abort")||e instanceof TypeError) return x.errNet;
  return x.errNet };

/* منتجات من القاعدة: تندمج مع المدمجة — نفس الـ id يستبدل، وactive=false يخفي */
function mapProduct(r){
  if(!r||!r.id||!r.cat) return null;
  const s=z=>z==null?"":String(z);
  const tri=(a,b,c)=>{const A=s(a)||s(b)||s(c); return [A,s(b)||A,s(c)||A]};
  const arr=z=>Array.isArray(z)?z.map(String).filter(Boolean)
    :(typeof z==="string"&&z.trim()?z.split(",").map(y=>y.trim()).filter(Boolean):[]);
  const triA=(a,b,c)=>{const A=arr(a),B=arr(b),C=arr(c); return [A,B.length?B:A,C.length?C:A]};
  const m={id:s(r.id),c:s(r.cat),w:+r.w||1,h:+r.h||1,cols:+r.cols||1,
    n:tri(r.name_ar,r.name_en,r.name_ku),s:tri(r.sub_ar,r.sub_en,r.sub_ku),
    d:tri(r.desc_ar,r.desc_en,r.desc_ku),t:triA(r.tags_ar,r.tags_en,r.tags_ku)};
  if(+r.solid) m.solid=+r.solid;
  if(r.hinge) m.hinge=s(r.hinge);
  if(r.img) m.img=s(r.img);
  [["slide","slide"],["fold","fold"],["auto_open","auto"],["mesh","mesh"],["frosted","frosted"],
   ["fixed_panel","fixed"],["arch","arch"],["project_out","project"],["guard","guard"],
   ["half_fixed","halffixed"],["glass_top","glassTop"],["hot","hot"],["is_new","newy"]]
   .forEach(([col,key])=>{ if(r[col]) m[key]=1 });
  return m;
}
async function syncProducts(){
  if(!SUPABASE.SYNC_PRODUCTS) return;
  try{
    const rows=await sbSelect(SUPABASE.T.products,"select=*&order=sort.asc");
    if(!Array.isArray(rows)||!rows.length) return;
    let n=0;
    rows.forEach(r=>{
      const k=MODELS.findIndex(z=>z.id===String(r.id));
      if(r.active===false){ if(k>-1){MODELS.splice(k,1);n++} return }
      const m=mapProduct(r); if(!m) return;
      if(k>-1) MODELS[k]=m; else MODELS.push(m);
      n++;
    });
    if(n) renderAll();
  }catch(e){ console.warn("[supabase] products:",e) }
}

/* ── بصمة الرمز ── */
const adNorm=s=>String(s||"").replace(/\s+/g," ").trim().toLowerCase();
function adFallback(s){
  let a=0x811c9dc5,b=5381;
  for(let i=0;i<s.length;i++){ a^=s.charCodeAt(i); a=Math.imul(a,0x01000193)>>>0;
    b=(Math.imul(b,33)+s.charCodeAt(i))>>>0 }
  return (a>>>0).toString(16).padStart(8,"0")+(b>>>0).toString(16).padStart(8,"0");
}
async function adSha(s){
  try{
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(v=>v.toString(16).padStart(2,"0")).join("");
  }catch(e){ return null }
}
async function adCheck(pass){
  const n=adNorm(pass); if(!n) return false;
  const h=await adSha(n);
  return h ? h===OWNER.H : adFallback(n)===OWNER.F;
}

/* ── النشر للقاعدة: دالة محمية أولاً، وإذا ما تشغّل SQL فرفع مباشر ── */
const adMissing=e=>/PGRST202|404|Could not find the function|does not exist/i.test(String(e&&e.message||e));
const sbUpsert=(table,row)=>sbReq(table,{method:"POST",
  headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(row)});

async function adPublish(p){
  const row=adRow(p); let where="local";
  try{
    try{ await sbRpc("admin_save_product",{p_pass:owner?owner.pass:"",p_row:row}); where="db" }
    catch(e1){ if(!adMissing(e1)) throw e1; await sbUpsert(SUPABASE.T.products,row); where="db" }
  }catch(e){ console.warn("[owner] publish:",e) }
  const l=adAll().filter(z=>z.id!==p.id);
  l.push(Object.assign({},p,{live:where==="db"}));
  adPut(l);
  return where;
}
async function adRemove(id){
  try{
    try{ await sbRpc("admin_delete_product",{p_pass:owner?owner.pass:"",p_id:id}) }
    catch(e1){ if(!adMissing(e1)) throw e1;
      await sbReq(SUPABASE.T.products+"?id=eq."+encodeURIComponent(id),
        {method:"DELETE",headers:{Prefer:"return=minimal"}}) }
  }catch(e){ console.warn("[owner] delete:",e) }
  adPut(adAll().filter(z=>z.id!==id));
  const k=MODELS.findIndex(z=>z.id===id); if(k>-1) MODELS.splice(k,1);
}

/* ── ضغط صورة المنتج ── */
function adShot(file,done){
  if(!file) return;
  if(!/^image\//i.test(file.type||"")){ toast(AD.imgBad); return }
  if(file.size>20*1024*1024){ toast(AD.imgBig); return }
  const fr=new FileReader();
  fr.onerror=()=>toast(AD.imgBad);
  fr.onload=()=>{
    const im=new Image();
    im.onerror=()=>toast(AD.imgBad);
    im.onload=()=>{
      try{
        const MAX=900, sc=Math.min(1,MAX/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*sc));
        c.height=Math.max(1,Math.round(im.height*sc));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        let q=.82, out=c.toDataURL("image/jpeg",q);
        while(out.length>130000&&q>.34){ q-=.1; out=c.toDataURL("image/jpeg",q) }
        done(out);
      }catch(e){ toast(AD.imgBad) }
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}

/* ═══════════════════════ نظام الريلز — المالك ينشر، الكل يشاهد ═══════════════════════
   الفكرة: شاشة ريلز عمودية (سحب فوق/تحت) يشوفها كل الزوّار. النشر للمالك فقط
   (يستعمل نفس بصمة المالك OWNER). المالك ينشر فيديو واحد لكل ريل بحد أقصى دقيقتين،
   يختار دقة الإخراج (٤٨٠p / ٧٢٠p / ١٠٨٠p)، ويحط موسيقى هادئة تُدمج داخل المقطع.
   زر (حفظ) = مسوّدة بجهازه مع الوصف — ما تظهر للناس. زر (نشر) = تروح للعام.

   ── جدول القاعدة: شغّله مرة وحدة في لوحة Supabase ← SQL Editor ← New query ──
   (يعتمد على دالة admin_ok الموجودة أصلاً بنظام المنتجات)

   create table if not exists public.reels (
     id text primary key,
     created_at timestamptz not null default now(),
     active boolean not null default true, sort int not null default 10,
     descr text, video text, poster text,
     music text, baked boolean not null default true,
     quality text, dur numeric default 0 );

   alter table public.reels enable row level security;
   drop policy if exists "app read reels" on public.reels;
   create policy "app read reels" on public.reels for select to anon, authenticated using (active);
   create index if not exists reels_created_idx on public.reels (created_at desc);

   create or replace function public.admin_save_reel(p_pass text, p_row jsonb)
   returns void language plpgsql security definer set search_path = public as $$
   begin
     if not admin_ok(p_pass) then raise exception 'bad_pass'; end if;
     insert into reels (id,active,sort,descr,video,poster,music,baked,quality,dur)
     select x.id,coalesce(x.active,true),coalesce(x.sort,10),x.descr,x.video,x.poster,
            x.music,coalesce(x.baked,true),x.quality,coalesce(x.dur,0)
     from jsonb_to_record(p_row) as x(id text,active boolean,sort int,descr text,video text,
          poster text,music text,baked boolean,quality text,dur numeric)
     on conflict (id) do update set
       active=excluded.active, sort=excluded.sort, descr=excluded.descr,
       video =coalesce(excluded.video ,reels.video),
       poster=coalesce(excluded.poster,reels.poster),
       music=excluded.music, baked=excluded.baked, quality=excluded.quality, dur=excluded.dur;
   end $$;

   create or replace function public.admin_delete_reel(p_pass text, p_id text)
   returns void language plpgsql security definer set search_path = public as $$
   begin
     if not admin_ok(p_pass) then raise exception 'bad_pass'; end if;
     delete from reels where id = p_id;
   end $$;

   grant execute on function public.admin_save_reel(text,jsonb)  to anon, authenticated;
   grant execute on function public.admin_delete_reel(text,text) to anon, authenticated;
   ──────────────────────────────────────────────────────────────── */

/* ═════════ تخزين محلي (IndexedDB للمقاطع + localStorage للفهرس) ═════════ */
let _rlDB = null;
function rlIDB(){
  if(_rlDB) return Promise.resolve(_rlDB);
  return new Promise((res,rej)=>{
    let rq; try{ rq=indexedDB.open("ha_reels",1) }catch(e){ return rej(e) }
    rq.onupgradeneeded=()=>{ const db=rq.result;
      if(!db.objectStoreNames.contains("drafts")) db.createObjectStore("drafts",{keyPath:"id"});
      if(!db.objectStoreNames.contains("pub"))    db.createObjectStore("pub",{keyPath:"id"});
    };
    rq.onsuccess=()=>{ _rlDB=rq.result; res(_rlDB) };
    rq.onerror=()=>rej(rq.error);
  });
}
async function idbPut(store,val){ const db=await rlIDB(); return new Promise((res,rej)=>{
  const tx=db.transaction(store,"readwrite"); tx.objectStore(store).put(val);
  tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
async function idbGet(store,key){ const db=await rlIDB(); return new Promise((res,rej)=>{
  const r=db.transaction(store,"readonly").objectStore(store).get(key);
  r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); }
async function idbAll(store){ const db=await rlIDB(); return new Promise((res,rej)=>{
  const r=db.transaction(store,"readonly").objectStore(store).getAll();
  r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }
async function idbDel(store,key){ const db=await rlIDB(); return new Promise((res,rej)=>{
  const tx=db.transaction(store,"readwrite"); tx.objectStore(store).delete(key);
  tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }

/* ═════════ قدرات المعالجة ═════════ */
function rlMime(){
  const c=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus",
           "video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm","video/mp4"];
  for(const m of c){ try{ if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m)) return m }catch(e){} }
  return "";
}
const rlCanEncode = ()=> !!(window.MediaRecorder && HTMLCanvasElement.prototype.captureStream && rlMime());

/* لقطة غلاف سريعة بدون معالجة */
function rlGrabPoster(blob,at){
  return new Promise(res=>{
    const url=URL.createObjectURL(blob), v=document.createElement("video");
    v.src=url; v.muted=true; v.playsInline=true;
    const fail=()=>{ URL.revokeObjectURL(url); res(null) };
    v.onerror=fail;
    v.onloadeddata=()=>{ try{ v.currentTime=Math.min(at||0.3, (v.duration||1)-0.05) }catch(e){} };
    v.onseeked=()=>{ try{
      const w=200, h=Math.round(w*(v.videoHeight/v.videoWidth||1.6));
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(v,0,0,w,h);
      const d=c.toDataURL("image/jpeg",0.55); URL.revokeObjectURL(url); res(d);
    }catch(e){ fail() } };
    setTimeout(fail,4000);
  });
}
function rlMeta(blob){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(blob), v=document.createElement("video");
    v.src=url; v.muted=true; v.playsInline=true;
    v.onloadedmetadata=()=>{ res({dur:v.duration||0,w:v.videoWidth||0,h:v.videoHeight||0,url,v}) };
    v.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("meta")) };
    setTimeout(()=>rej(new Error("meta-timeout")),8000);
  });
}

/* المعالجة: قصّ فقط — نفس دقة الفيديو الأصلية وصوته الأصلي (بدون رفع دقة/موسيقى) */
async function rlEncode(o,onprog){
  const mime=rlMime(); if(!mime) throw new Error("unsupported");
  const url=URL.createObjectURL(o.blob), vid=document.createElement("video");
  vid.src=url; vid.playsInline=true; vid.muted=false;
  await new Promise((res,rej)=>{ vid.onloadedmetadata=res; vid.onerror=()=>rej(new Error("vid")); });
  const srcW=vid.videoWidth||720, srcH=vid.videoHeight||1280, aspect=srcW/srcH;
  /* نفس الدقة الأصلية — بدون تكبير. سقف أمان فقط حتى ما يصير الملف ضخم */
  let outW=srcW, outH=srcH;
  const CAP=1280; const big=Math.max(outW,outH);
  if(big>CAP){ const k=CAP/big; outW=Math.round(outW*k); outH=Math.round(outH*k); }
  outW-=outW%2; outH-=outH%2; outW=Math.max(2,outW); outH=Math.max(2,outH);
  const canvas=document.createElement("canvas"); canvas.width=outW; canvas.height=outH;
  const cx=canvas.getContext("2d"), fps=30, cstream=canvas.captureStream(fps);

  let AC=null;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    /* نفتح AudioContext قبل أي شي — بعض المتصفحات تبدأه suspended */
    if(AC.state==="suspended"){ try{ await AC.resume() }catch(e){} }
    const dest=AC.createMediaStreamDestination();
    const sn=AC.createMediaElementSource(vid);
    sn.connect(dest);
    /* نربط الصوت بالسماعات أيضاً حتى يتم التسجيل بشكل صحيح */
    sn.connect(AC.destination);
    const at=dest.stream.getAudioTracks()[0]; if(at) cstream.addTrack(at);
  }catch(e){ AC=null; }

  const bit = outH>=1000?2600000 : outH>=700?1600000 : outH>=440?900000 : 700000;
  let rec; try{ rec=new MediaRecorder(cstream,{mimeType:mime,videoBitsPerSecond:bit}); }
  catch(e){ rec=new MediaRecorder(cstream); }
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data) };

  const start=Math.max(0,o.start||0);
  const end=Math.min(vid.duration||(start+o.dur), start+Math.min(o.dur||120,120));
  await new Promise(res=>{ vid.onseeked=res; try{ vid.currentTime=start }catch(e){ res() } });

  let poster=null;
  const done=new Promise((resolve,reject)=>{
    rec.onstop=()=>{ try{AC&&AC.close()}catch(e){}
      URL.revokeObjectURL(url);
      resolve({blob:new Blob(chunks,{type:mime.split(";")[0]}),poster,dur:+(end-start).toFixed(1)}); };
    rec.onerror=e=>reject((e&&e.error)||new Error("rec"));
  });
  rec.start(300);
  /* نتأكد AudioContext شغال قبل تشغيل الفيديو */
  if(AC&&AC.state==="suspended"){ try{ await AC.resume() }catch(e){} }
  try{ await vid.play() }catch(e){}

  let raf;
  const draw=()=>{
    const s=Math.max(outW/srcW,outH/srcH), dw=srcW*s, dh=srcH*s;
    try{ cx.drawImage(vid,(outW-dw)/2,(outH-dh)/2,dw,dh) }catch(e){}
    if(!poster && vid.currentTime>start+0.06){ try{ poster=canvas.toDataURL("image/jpeg",0.6) }catch(e){} }
    onprog && onprog(Math.min(1,(vid.currentTime-start)/Math.max(0.1,end-start)));
    if(vid.currentTime>=end-0.03 || vid.ended){ try{rec.stop()}catch(e){} try{vid.pause()}catch(e){} return; }
    raf=requestAnimationFrame(draw);
  };
  raf=requestAnimationFrame(draw);
  const out=await done; cancelAnimationFrame(raf);
  if(!out.poster) out.poster=await rlGrabPoster(out.blob,0.2).catch(()=>null);
  return out;
}
const rlBlobToURL = b => new Promise((res,rej)=>{ const fr=new FileReader();
  fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(b); });

function rlItemHTML(r){

let _rlObs=null;
const LS_RLSOUND="ha_reels_sound_v1";
let _rlAudioOn = lsGet(LS_RLSOUND)===true;
function rlRenderFeed(){
  rlEnsureView();
  const feed=document.getElementById("rl-feed"); if(!feed) return;
  if(!REELS.length){
    feed.innerHTML=`<div class="rl-empty">
      <div class="rl-elogo">${rlBrandHTML()}</div>
      <p>${RL.none}</p>${owner?`<p class="rl-esub">${RL.noneOwner}</p>
      <button class="btn btn-p" id="rl-empty-add">＋ ${RL.new}</button>`:""}</div>`;
    const a=document.getElementById("rl-empty-add"); if(a) a.onclick=()=>rlEditor(null);
    return;
  }
  feed.innerHTML=REELS.map(rlItemHTML).join("");
  /* نقر التشغيل/الإيقاف */
  feed.querySelectorAll(".rl-tap").forEach(btn=>btn.onclick=()=>{
    const it=btn.closest(".rl-item"), v=it.querySelector("video");
    if(!_rlAudioOn){
      rlAudioUnlock();
      /* فتح الصوت لكل الفيديوات المحمّلة */
      document.querySelectorAll(".rl-item video").forEach(vv=>{ try{vv.muted=false}catch(e){} });
      if(v.paused){
        const p=v.play(); if(p&&p.catch) p.catch(()=>{
          /* لو فشل التشغيل — نعيد muted ونشغل بصمت */
          v.muted=true; v.play().then(()=>{ v.muted=false; }).catch(()=>{});
        });
        it.classList.remove("paused");
      }
      return;
    }
    if(v.paused){
      const p=v.play(); if(p&&p.catch) p.catch(()=>{});
      it.classList.remove("paused");
    } else { v.pause(); it.classList.add("paused"); }
  });
  /* التشغيل التلقائي للأوضح */
  if(_rlObs) _rlObs.disconnect();
  _rlObs=new IntersectionObserver(es=>{ es.forEach(en=>{
    const it=en.target, v=it.querySelector("video"), r=REELS.find(z=>z.id===it.dataset.id);
    if(en.isIntersecting && en.intersectionRatio>0.6){
      rlAttach(v,it,r).then(()=>{
        try{ v.muted=!_rlAudioOn }catch(e){}
        const p=v.play();
        if(p&&p.catch) p.catch(()=>{
          /* المتصفح منع التشغيل بالصوت — شغّل بصمت ثم حاول فتح الصوت */
          v.muted=true;
          v.play().then(()=>{ if(_rlAudioOn){ v.muted=false; } }).catch(()=>{});
        });
        it.classList.remove("paused");
      });
    } else { try{v.pause()}catch(e){} }
  }); },{threshold:[0,0.6,1]});
  feed.querySelectorAll(".rl-item").forEach(it=>_rlObs.observe(it));
}
async function rlAttach(v,it,r){
  if(v.dataset.loaded) return; v.dataset.loaded="1";
  const u=await rlVideoURL(r);
  if(!u){ v.dataset.loaded=""; return; }
  v.src=u;
  v.load();
  const baked=it.dataset.baked!=="false", start=+it.dataset.start||0, end=+it.dataset.end||0;
  if(!baked && start){ v.addEventListener("loadeddata",()=>{ try{v.currentTime=start}catch(e){} },{once:true}); }
  if(!baked && end){ v.addEventListener("timeupdate",()=>{ if(v.currentTime>=end) v.currentTime=start||0; }); }
  const snd=it.querySelector(".rl-snd"); if(snd&&!_rlAudioOn) snd.hidden=false;
  /* ننتظر بيانات كافية قبل التشغيل */
  await new Promise(res=>{
    if(v.readyState>=2){ res(); return; }
    v.addEventListener("canplay",res,{once:true});
    v.addEventListener("error",res,{once:true});
    /* timeout احتياطي لو التحميل بطيء */
    setTimeout(res,8000);
  });
  try{ v.muted=!_rlAudioOn }catch(e){}
  try{
    await v.play();
  }catch(e){
    /* fallback: شغّل بصمت أولاً ثم حاول فتح الصوت */
    try{ v.muted=true; await v.play(); if(_rlAudioOn) v.muted=false; }catch(e2){}
  }
}
function rlAudioUnlock(){
  if(_rlAudioOn) return; _rlAudioOn=true;
  lsSet(LS_RLSOUND,true);   /* يضل الصوت مفعّل مدى الحياة حتى بعد إغلاق المتصفح */
  document.querySelectorAll(".rl-snd").forEach(s=>s.hidden=true);
  /* فتح الصوت لكل الفيديوات — مو بس الحالي */
  document.querySelectorAll(".rl-item video").forEach(v=>{
    try{ v.muted=false; }catch(e){}
  });
  /* إذا ما يشتغل الحالي — أعد تشغيله بصوت */
  const cur=[...document.querySelectorAll(".rl-item")].find(it=>{
    const v=it.querySelector("video"); return v && !v.paused; });
  if(cur){
    const v=cur.querySelector("video");
    try{ v.muted=false; }catch(e){}
    /* لو المتصفح رفض — أوقف وشغّل من جديد بصوت */
    if(v.paused){
      const p=v.play(); if(p&&p.catch) p.catch(()=>{});
    }
  }
}

/* ═════════ محرّر الريل (المالك) ═════════ */
function rlEditor(draft){
  let file=draft?draft.blob:null, meta=draft?{dur:draft.dur||0}:null, posterQuick=draft?draft.poster:null;
  let start=draft?draft.start||0:0, len=draft?draft.dur||0:0;

  openSheet(`<h3 style="font-size:19px">${draft?RL.edit:RL.new}</h3>
    <div class="opt" style="margin-top:12px">
      <div class="rl-slot" id="rl-slot"><span class="sub" style="font-size:12px">${RL.noVid}</span></div>
      <div class="adbar"><button class="fixbtn" id="rl-pick">${file?RL.changeVid:RL.pickVid}</button>
        <span class="sub" id="rl-dur" style="font-size:12px"></span></div>
      <p class="avhint" style="text-align:start;margin-top:6px">${RL.max2}</p></div>
    <input type="file" id="rl-file" accept="video/*" style="display:none">
    <div id="rl-trim" hidden>
      <div class="opt"><label>${RL.start} — <span id="rl-startv" class="mono"></span></label>
        <input class="rl-range" id="rl-startr" type="range" min="0" max="0" step="1" value="0"></div>
      <div class="opt"><label>${RL.length} — <span id="rl-lenv" class="mono"></span></label>
        <input class="rl-range" id="rl-lenr" type="range" min="3" max="120" step="1" value="30"></div>
    </div>
    <p class="avhint" style="text-align:start;margin-top:2px">${RL.origSound}</p>
    <div class="opt"><label for="rl-desc">${RL.descL}</label>
      <textarea class="ctrl" id="rl-desc" placeholder="${RL.descPh}">${esc(draft?draft.descr||"":"")}</textarea></div>
    <div class="rl-prog" id="rl-prog" hidden><div class="rl-bar"><i id="rl-bari"></i></div>
      <span class="sub" id="rl-progt" style="font-size:12px"></span></div>
    <div class="acts">
      <button class="btn btn-p" id="rl-pub">${RL.pub}</button>
      <button class="btn btn-o" id="rl-save">${RL.save}</button></div>
    <div class="acts" style="margin-top:8px"><button class="btn btn-o" id="rl-cancel">${RL.cancel}</button></div>`);

  const slot=document.getElementById("rl-slot"), durEl=document.getElementById("rl-dur"),
        fileEl=document.getElementById("rl-file"), trim=document.getElementById("rl-trim"),
        sr=document.getElementById("rl-startr"), lr=document.getElementById("rl-lenr"),
        sv=document.getElementById("rl-startv"), lv=document.getElementById("rl-lenv");
  const fmt=s=>{ s=Math.max(0,Math.round(s)); return (s/60|0)+":"+String(s%60).padStart(2,"0") };

  function paintSlot(){
    slot.innerHTML = posterQuick?`<img src="${esc(posterQuick)}" alt="">`
      :`<span class="sub" style="font-size:12px">${file?"✓":RL.noVid}</span>`;
    document.getElementById("rl-pick").textContent=file?RL.changeVid:RL.pickVid;
  }
  function paintTrim(){
    if(!meta||!meta.dur){ trim.hidden=true; durEl.textContent=""; return; }
    const D=meta.dur; durEl.textContent=fmt(D)+(D>120?" ⚠":"");
    trim.hidden=false;
    sr.max=Math.max(0,Math.floor(D-3)); if(start>+sr.max) start=+sr.max; sr.value=start;
    const maxLen=Math.min(120,Math.max(3,Math.floor(D-start)));
    lr.max=maxLen; if(!len||len>maxLen) len=maxLen; lr.value=len;
    sv.textContent=fmt(start); lv.textContent=fmt(len);
  }
  sr.oninput=()=>{ start=+sr.value; const maxLen=Math.min(120,Math.max(3,Math.floor((meta.dur||0)-start)));
    lr.max=maxLen; if(len>maxLen){ len=maxLen; lr.value=len } sv.textContent=fmt(start); lv.textContent=fmt(len); };
  lr.oninput=()=>{ len=+lr.value; lv.textContent=fmt(len); };
  paintSlot();

  async function loadFile(f){
    if(!/^video\//i.test(f.type||"")){ toast(RL.vidBad); return; }
    if(f.size>200*1024*1024){ toast(RL.vidBig); return; }
    file=f; start=0; len=0;
    try{ const m=await rlMeta(f); meta={dur:m.dur,w:m.w,h:m.h}; URL.revokeObjectURL(m.url); }
    catch(e){ meta={dur:0}; }
    posterQuick=await rlGrabPoster(f,0.3).catch(()=>null);
    paintSlot(); paintTrim();
  }
  document.getElementById("rl-pick").onclick=()=>fileEl.click();
  fileEl.onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(f) loadFile(f); fileEl.value=""; };
  if(draft){ meta={dur:draft.dur||0}; paintTrim(); }

  document.getElementById("rl-cancel").onclick=()=>{ closeSheet(); };

  const settings=()=>({start:Math.round(start),
    dur:Math.round(len||Math.min(120,meta&&meta.dur||30))});

  /* حفظ مسودة — بدون معالجة، بسرعة (يكتب الوصف بس) */
  document.getElementById("rl-save").onclick=async()=>{
    if(!file){ toast(RL.needVid); return; }
    const s=settings(), id=draft?draft.id:"r"+Date.now().toString(36);
    const d={id,blob:file,poster:posterQuick,descr:document.getElementById("rl-desc").value.trim(),
             start:s.start,dur:s.dur,ts:Date.now()};
    try{ await idbPut("drafts",d); toast(RL.savedDraft); }catch(e){ toast(RL.vidBig); }
    closeSheet();
  };

  /* نشر — قصّ فقط (نفس الدقة والصوت الأصلي) ثم رفع للقاعدة */
  document.getElementById("rl-pub").onclick=async()=>{
    if(!file){ toast(RL.needVid); return; }
    const s=settings(), descr=document.getElementById("rl-desc").value.trim();
    const id=draft?draft.id:"r"+Date.now().toString(36);
    const prog=document.getElementById("rl-prog"), bari=document.getElementById("rl-bari"),
          progt=document.getElementById("rl-progt");
    const pub=document.getElementById("rl-pub"), sv2=document.getElementById("rl-save");
    pub.disabled=sv2.disabled=true; prog.hidden=false; progt.textContent=RL.processing;

    let out, baked=true;
    try{
      if(rlCanEncode()){
        out=await rlEncode({blob:file,start:s.start,dur:s.dur,audio:"orig"},
              p=>{ bari.style.width=Math.round(p*100)+"%"; });
      }else{
        baked=false;
        out={blob:file,poster:posterQuick||await rlGrabPoster(file,0.3).catch(()=>null),dur:s.dur};
      }
    }catch(e){ console.warn("[reel] encode",e); pub.disabled=sv2.disabled=false; prog.hidden=true;
      toast(RL.encFail); return; }

    progt.textContent=RL.saving; bari.style.width="100%";
    const dataURL=await rlBlobToURL(out.blob).catch(()=>null);
    if(!dataURL){ pub.disabled=sv2.disabled=false; prog.hidden=true; toast(RL.encFail); return; }

    const meta2={id,active:true,descr,poster:out.poster||posterQuick||null,
      music:"orig",baked,quality:"",dur:out.dur||s.dur,
      start:baked?0:s.start,end:baked?0:(s.start+ (out.dur||s.dur))};
    const row=Object.assign({sort:10,video:dataURL},meta2);

    let where="local";
    if(dataURL.length<=RL_MAXPUB){
      try{ await rlDbSave(row); where="db"; }
      catch(e){ console.warn("[reel] publish",e); where="local"; }
    } else {
      where="local"; /* أكبر من حد النشر — بنخزنه بالجهاز ونعلم المالك */
    }

    if(where==="local"){
      try{ await idbPut("pub",Object.assign({},meta2,{blob:out.blob})); }catch(e){}
    }
    /* فهرس المالك (صورة مصغّرة فقط حتى ما يمتلئ التخزين) */
    const thumb=await rlThumb(out.poster||posterQuick).catch(()=>out.poster||posterQuick||null);
    rlMineSet({id,descr,poster:thumb,music:"orig",quality:"",dur:out.dur||s.dur,
      active:true,live:where==="db",ts:Date.now()});
    if(draft){ try{ await idbDel("drafts",draft.id) }catch(e){} }

    rlVidCache.delete(id); await rlLoad(); rlRenderFeed(); closeSheet();
    toast(dataURL.length>RL_MAXPUB?RL.tooBig:(where==="db"?RL.pubDone:RL.pubLocal));
  };
}
/* صورة مصغّرة صغيرة للفهرس */
function rlThumb(dataURL){
  return new Promise(res=>{ if(!dataURL) return res(null);
    const im=new Image(); im.onload=()=>{ try{
      const w=120,h=Math.round(w*(im.height/im.width||1.6)), c=document.createElement("canvas");
      c.width=w; c.height=h; c.getContext("2d").drawImage(im,0,0,w,h); res(c.toDataURL("image/jpeg",0.5));
    }catch(e){ res(dataURL) } }; im.onerror=()=>res(dataURL); im.src=dataURL; });
}

function rlCSS(){
  if(document.getElementById("reels-css")) return;
  const s=document.createElement("style"); s.id="reels-css";
  s.textContent=`
  body.reels .topbar{display:none}
  body.reels main{padding-bottom:0}
