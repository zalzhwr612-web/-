<style>
:root{
  --bg:#FFFFFF; --wash:#F5F7FC; --card:#FFFFFF; --cardb:#FFFFFF;
  --ink:#0F1724; --muted:#6B7887; --line:#E6EAF3; --art:var(--brand-soft);
  --brand:#1B72E8; --brand-2:#4285F4; --brand-3:#7BA7FF; --brand-soft:#E8F0FE; --brand-ink:#0B3B8F;
  --amber:#F5A524; --green:#12A150;
  --font:"Tajawal",system-ui,sans-serif;
  --pad:16px; --tabh:64px; --r:16px;
  --T:2.8s cubic-bezier(.4,0,.2,1);
  --shadow:0 2px 10px rgba(15,23,36,.06);
  --shadow-lg:0 12px 30px rgba(15,23,36,.12);
}
body.dark{
  --bg:#070B14; --wash:#05070D; --card:rgba(17,24,40,.72); --cardb:#111828;
  --ink:#E9EFFA; --muted:#93A2BE; --line:rgba(255,255,255,.10); --art:rgba(255,255,255,.05);
  --shadow:0 2px 14px rgba(0,0,0,.45); --shadow-lg:0 14px 34px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--wash);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.75;
  overscroll-behavior-y:none;transition:background-color .5s,color .5s}
h1,h2,h3{font-family:var(--font);font-weight:700;line-height:1.45;margin:0}
.mono{font-family:"IBM Plex Mono",monospace;direction:ltr;unicode-bidi:isolate}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
#sky{position:fixed;inset:0;z-index:0;display:none;pointer-events:none}
body.dark #sky{display:block}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;z-index:1}

/* شفق الهيدر */
.aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(34px);opacity:.7;transition:background-color var(--T)}
.b1{width:190px;height:190px;background:var(--brand-2);top:-70px;inset-inline-start:-40px;animation:f1 19s ease-in-out infinite}
.b2{width:170px;height:170px;background:var(--brand-3);top:-40px;inset-inline-end:-50px;animation:f2 23s ease-in-out infinite}
.b3{width:150px;height:150px;background:var(--brand);bottom:-70px;inset-inline-start:35%;animation:f3 27s ease-in-out infinite}
@keyframes f1{50%{transform:translate(40px,26px) scale(1.15)}}
@keyframes f2{50%{transform:translate(-34px,30px) scale(1.1)}}
@keyframes f3{50%{transform:translate(26px,-24px) scale(1.2)}}

.topbar{position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;padding:12px var(--pad) 15px;
  border-radius:0 0 22px 22px;overflow:hidden;transition:background-color var(--T);
  box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 32%,transparent)}
.trow,.search{position:relative;z-index:2}
.trow{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:13px;background:#0F151C;flex:none;overflow:hidden;display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.14)}
.logo img{width:74%;height:auto;display:block}
.tt{min-width:0;flex:1}
.tt b{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt span{display:block;font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{position:relative;width:40px;height:40px;flex:none;border:0;border-radius:12px;background:rgba(255,255,255,.2);
  color:#fff;display:grid;place-items:center;cursor:pointer}
.hbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-5px;inset-inline-start:-5px;min-width:19px;height:19px;border-radius:99px;
  background:var(--amber);color:#3A2500;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 5px;font-family:"IBM Plex Mono"}
.badge.on{display:grid}
.search{margin-top:12px;display:flex;align-items:center;gap:9px;background:var(--cardb);border-radius:14px;padding:11px 13px}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:none}
.search input{border:0;outline:0;width:100%;background:transparent;font-size:14px;color:var(--ink)}

main{padding-bottom:calc(var(--tabh) + 30px);position:relative}
.view{display:none;animation:rise .28s ease both}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{padding:20px var(--pad) 0}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sechead h2{font-size:17px}
.link{color:var(--brand);font-size:13px;font-weight:600;background:0;border:0;cursor:pointer;padding:0;transition:color var(--T)}
.sub{color:var(--muted);font-size:13.5px;margin:0}

.banner{position:relative;margin:16px var(--pad) 0;border-radius:20px;padding:20px;color:#fff;overflow:hidden;
  background:var(--brand);transition:background-color var(--T)}
.banner .in{position:relative;z-index:2}
.banner h2{font-size:18px}
.banner p{margin:6px 0 13px;font-size:13px;opacity:.92}
.banner button{border:0;background:#fff;color:var(--brand);font-weight:700;font-size:13.5px;padding:10px 17px;
  border-radius:12px;cursor:pointer;transition:color var(--T)}

.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:0 var(--pad);margin-top:14px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow);transition:transform .18s;
  backdrop-filter:blur(8px)}
.cat:active{transform:scale(.96)}
.cat .ci{width:34px;height:34px;border-radius:11px;background:var(--brand-soft);display:grid;place-items:center;transition:background-color var(--T)}
body.dark .cat .ci{background:rgba(255,255,255,.08)}
.cat .ci svg{width:19px;height:19px;stroke:var(--brand);fill:none;stroke-width:1.6;transition:stroke var(--T)}
body.dark .cat .ci svg{stroke:var(--brand-3)}
.cat span{font-size:11.5px;font-weight:600;text-align:center}

.rail{display:flex;gap:12px;overflow-x:auto;padding:2px var(--pad) 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .prod{flex:none;width:158px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 var(--pad)}
.prod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:start;
  padding:0;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s;position:relative;display:block;width:100%;
  backdrop-filter:blur(8px)}
.prod:active{transform:scale(.985)}
.prod .art{background:var(--art);padding:14px 14px 6px;position:relative;transition:background-color var(--T)}
.prod .art svg{display:block;width:100%;height:98px}
.prod .art .photo{display:block;width:100%;height:104px;object-fit:cover;border-radius:9px}
.pill{position:absolute;top:9px;inset-inline-start:9px;background:var(--cardb);color:var(--brand);font-size:10.5px;
  font-weight:700;padding:3px 9px;border-radius:9px;box-shadow:var(--shadow);transition:color var(--T)}
.prod .meta{padding:10px 12px 12px}
.prod b{display:block;font-weight:700;font-size:13.5px}
.prod .desc{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.prod .buy{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.price{font-size:12px;color:var(--brand);font-weight:700;transition:color var(--T)}
body.dark .price,body.dark .link,body.dark .pill{color:var(--brand-3)}
.add{width:30px;height:30px;border-radius:10px;border:0;background:var(--brand);color:#fff;font-size:18px;line-height:1;
  display:grid;place-items:center;transition:background-color var(--T)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 var(--pad) 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 15px;
  font-size:13px;cursor:pointer;transition:background-color var(--T),border-color var(--T),color .2s}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.empty{text-align:center;padding:40px var(--pad);color:var(--muted)}
.empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px}

.scrim{position:fixed;inset:0;background:rgba(5,8,16,.6);z-index:60;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;background:var(--cardb);
  border-radius:24px 24px 0 0;padding:8px var(--pad) calc(18px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow:auto;
  border-top:1px solid var(--line)}
.sheet.on{transform:none}
.handle{width:42px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 12px}
.hero-art{background:var(--art);border-radius:16px;padding:16px;transition:background-color var(--T)}
.hero-art svg{display:block;width:100%;height:auto;max-height:190px}
.hero-art .photo{width:100%;max-height:230px;object-fit:cover;border-radius:12px;display:block}
.divider{height:1px;background:var(--line);margin:18px 0 14px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tag{background:var(--wash);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:11.5px;color:var(--muted)}
.opt{margin-top:16px}
.opt label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.ctrl{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:0;transition:.18s;color:var(--ink)}
.ctrl:focus-visible{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
textarea.ctrl{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:130px}
.stepper button{width:40px;height:42px;border:0;background:var(--wash);font-size:18px;cursor:pointer;color:var(--brand);transition:color var(--T)}
.stepper input{width:50px;text-align:center;border:0;outline:0;background:transparent;font-family:"IBM Plex Mono";color:var(--ink)}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:background-color var(--T),transform .15s}
.btn:active{transform:scale(.99)}
.btn-p{background:var(--brand);color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--brand) 35%,transparent)}
.btn-o{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn-wa{background:var(--green);color:#fff}
.acts{display:grid;gap:10px;margin-top:18px}

.line{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px;
  margin:0 var(--pad) 10px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.line .thumb{width:70px;height:70px;flex:none;border-radius:12px;background:var(--art);padding:8px;display:grid;place-items:center}
.line .thumb svg,.line .thumb .photo{width:100%;height:100%;object-fit:cover;border-radius:9px}
.line .body{flex:1;min-width:0}
.line b{display:block;font-weight:700;font-size:13.5px}
.line .spec{font-size:11.5px;color:var(--muted);margin-top:2px}
.line .ft{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.qty{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:2px 4px}
.qty button{border:0;background:0;color:var(--brand);font-size:16px;width:22px;cursor:pointer}
.qty span{font-family:"IBM Plex Mono";font-size:12.5px;min-width:16px;text-align:center}
.rm{border:0;background:0;color:#E2685A;font-size:12px;cursor:pointer}
.summary{margin:6px var(--pad) 0;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px}
.summary .r{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);padding:3px 0}
.summary .r b{color:var(--ink)}
.note{background:var(--brand-soft);border-radius:13px;padding:12px;font-size:12.5px;color:var(--brand-ink);
  margin:12px var(--pad) 0;transition:background-color var(--T),color var(--T)}
body.dark .note{background:rgba(255,255,255,.07);color:var(--brand-3)}
.err{display:none;color:#E2685A;font-size:12px;margin-top:6px}
.opt.bad .ctrl{border-color:#E2685A}
.opt.bad .err{display:block}

.info{margin:0 var(--pad);background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.info .item{display:flex;gap:12px;align-items:flex-start;padding:14px;border-bottom:1px solid var(--line)}
.info .item:last-child{border-bottom:0}
.info .ic{width:36px;height:36px;flex:none;border-radius:12px;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-size:16px;transition:background-color var(--T),color var(--T)}
body.dark .info .ic{background:rgba(255,255,255,.08);color:var(--brand-3)}
.info b{display:block;font-weight:700;font-size:13.5px}
.info span{font-size:12.5px;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px var(--pad) 0}

/* بطاقة إنستغرام */
.ig{display:flex;align-items:center;gap:12px;margin:16px var(--pad) 0;padding:14px;border-radius:20px;color:#fff;
  position:relative;overflow:hidden;transition:transform .15s;
  box-shadow:0 10px 26px rgba(214,36,159,.30);
  background:radial-gradient(circle at 22% 118%,#FDD85D 0%,#FD8C3D 22%,#FA4E6B 45%,#D6249F 66%,#5B51D8 92%)}
.ig::after{content:"";position:absolute;inset:-45% -12%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.26),transparent 62%);animation:igGlow 8s ease-in-out infinite}
@keyframes igGlow{0%,100%{transform:translate(-18%,10%)}50%{transform:translate(20%,-12%)}}
.ig:active{transform:scale(.99)}
.ig .igi{width:46px;height:46px;flex:none;border-radius:15px;display:grid;place-items:center;position:relative;z-index:2;
  background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45)}
.ig .igi svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ig .igt{flex:1;min-width:0;position:relative;z-index:2}
.ig .igt b{display:block;font-size:14.5px;font-weight:700;line-height:1.5}
.ig .igt .handle{display:block;font-family:"IBM Plex Mono",monospace;direction:ltr;unicode-bidi:isolate;
  font-size:13px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ig .go{width:20px;height:20px;flex:none;position:relative;z-index:2;opacity:.92}
[dir="rtl"] .ig .go{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.ig::after{animation:none}}

/* ===== مساعد الذكاء الاصطناعي ===== */
.aifab{position:fixed;bottom:calc(var(--tabh) + 16px);inset-inline-end:max(16px,calc(50% - 244px));z-index:55;
  width:54px;height:54px;border:0;border-radius:18px;cursor:pointer;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--brand-2),var(--brand));transition:transform .18s,background var(--T);
  box-shadow:0 10px 26px color-mix(in srgb,var(--brand) 45%,transparent),0 0 0 1px rgba(255,255,255,.16) inset}
.aifab:active{transform:scale(.94)}
.aifab svg{width:25px;height:25px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.aifab i{position:absolute;inset:0;border-radius:18px;border:2px solid var(--brand-2);opacity:0;animation:aiPulse 3.4s ease-out infinite}
@keyframes aiPulse{0%{opacity:.55;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.45)}}

.aiwrap{position:fixed;inset:0;z-index:70;display:none}
.aiwrap.on{display:block}
.aiwrap .back{position:absolute;inset:0;background:rgba(6,10,20,.45);backdrop-filter:blur(3px)}
.aipanel{position:absolute;inset-inline:0;bottom:0;top:0;max-width:520px;margin:0 auto;background:var(--wash);
  display:flex;flex-direction:column;animation:aiUp .28s cubic-bezier(.4,0,.2,1) both}
@keyframes aiUp{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.aihead{background:var(--brand);color:#fff;padding:14px var(--pad);display:flex;align-items:center;gap:11px;
  border-radius:0 0 20px 20px;transition:background-color var(--T);flex:none}
.aihead .av{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35)}
.aihead .av svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.aihead .tx{flex:1;min-width:0}
.aihead b{display:block;font-size:15px}
.aihead span{display:block;font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aihead button{width:36px;height:36px;flex:none;border:0;border-radius:11px;background:rgba(255,255,255,.2);color:#fff;
  cursor:pointer;display:grid;place-items:center;font-size:17px}
.aibody{flex:1;overflow-y:auto;padding:16px var(--pad) 6px;display:flex;flex-direction:column;gap:10px;
  -webkit-overflow-scrolling:touch}
.msg{max-width:86%;padding:11px 14px;border-radius:17px;font-size:14px;line-height:1.8;white-space:pre-wrap;
  word-break:break-word;animation:rise .22s ease both;box-shadow:var(--shadow)}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-start-start-radius:6px}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-end-end-radius:6px;transition:background-color var(--T)}
.msg.err{align-self:flex-start;background:#FEF0E6;border:1px solid #F5A524;color:#8A3D14;border-start-start-radius:6px}
body.dark .msg.err{background:rgba(245,165,36,.13);color:#F5C27A}
.dots{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;background:var(--card);border:1px solid var(--line);
  border-radius:17px;border-start-start-radius:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:aiDot 1.3s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes aiDot{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.aichips{display:flex;gap:8px;overflow-x:auto;padding:8px var(--pad);flex:none;scrollbar-width:none}
.aichips::-webkit-scrollbar{display:none}
.aichips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--brand);border-radius:999px;
  padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;transition:color var(--T)}
.aifoot{flex:none;padding:8px var(--pad) calc(10px + env(safe-area-inset-bottom));background:var(--cardb);
  border-top:1px solid var(--line)}
.airow{display:flex;align-items:flex-end;gap:9px}
.airow textarea{flex:1;border:1px solid var(--line);background:var(--card);border-radius:15px;padding:11px 13px;
  font-size:14px;resize:none;max-height:110px;outline:0;line-height:1.6}
.airow textarea:focus{border-color:var(--brand)}
.airow button{width:44px;height:44px;flex:none;border:0;border-radius:14px;background:var(--brand);color:#fff;
  cursor:pointer;display:grid;place-items:center;transition:background-color var(--T),opacity .2s}
.airow button:disabled{opacity:.45}
.airow button svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .airow button svg{transform:scaleX(-1)}
.aidisc{text-align:center;font-size:10.5px;color:var(--muted);margin:7px 0 0}
.steps{margin:0 var(--pad);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.step{display:flex;gap:11px;padding:7px 0}
.step i{width:23px;height:23px;flex:none;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-style:normal;
  font-family:"IBM Plex Mono";font-size:11px;display:grid;place-items:center;margin-top:3px}
body.dark .step i{background:rgba(255,255,255,.08);color:var(--brand-3)}
.step b{display:block;font-weight:700;font-size:13.5px}
.step span{font-size:12.5px;color:var(--muted)}

/* الإعدادات */
.setgrid{display:grid;gap:8px;margin-top:8px}
.setopt{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);
  background:var(--card);border-radius:13px;padding:13px 14px;cursor:pointer;transition:.18s;width:100%;text-align:start}
.setopt[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent)}
.setopt b{font-weight:700;font-size:14px}
.setopt small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.setopt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.setopt[aria-pressed="true"] .dot{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 3px var(--cardb)}
.setlabel{font-size:11.5px;letter-spacing:1.4px;color:var(--muted);margin:18px 0 2px;font-weight:600}

.tabbar{position:fixed;bottom:0;inset-inline:0;z-index:50;max-width:520px;margin:0 auto;height:var(--tabh);
  padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--cardb) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{border:0;background:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:11px;cursor:pointer;position:relative;transition:color var(--T)}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--brand);font-weight:700}
body.dark .tab[aria-selected="true"]{color:var(--brand-3)}
.tab .cb{position:absolute;top:6px;inset-inline-start:calc(50% + 6px);min-width:17px;height:17px;border-radius:99px;
  background:var(--amber);color:#3A2500;font-size:10px;font-weight:700;display:none;place-items:center;padding:0 4px;font-family:"IBM Plex Mono"}
.tab .cb.on{display:grid}
.toast{position:fixed;bottom:calc(var(--tabh) + 18px);inset-inline:0;margin:0 auto;width:max-content;max-width:88%;
  background:#0F1724;color:#fff;border-radius:12px;padding:11px 16px;font-size:13px;z-index:70;opacity:0;
  transform:translateY(8px);pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:var(--shadow-lg)}
body.dark .toast{background:#1D2740;border:1px solid var(--line)}
.toast.on{opacity:1;transform:none}
.foot{text-align:center;color:var(--muted);font-size:11.5px;padding:24px var(--pad) 12px}
.reportlink{border:0;background:0;color:var(--brand);font-family:inherit;font-size:11.5px;cursor:pointer;
  text-decoration:underline;padding:6px 0}
body.dark .reportlink{color:var(--brand-3)}
.devline{display:block;margin-top:6px;color:var(--muted);font-size:11px}
.devline b{color:#C39A4E}

.credit{margin:6px var(--pad) 0;background:linear-gradient(170deg,#FFFFFF,#FBF7EF);border:1px solid #EADFC6;
  border-radius:20px;padding:20px 16px 18px;text-align:center;box-shadow:var(--shadow)}
body.dark .credit{background:linear-gradient(170deg,#141A28,#0D121C);border-color:#3A3122}
.credit img{width:min(180px,52%);height:auto;display:block;margin:0 auto 12px;border-radius:12px}
.credit .kicker{font-size:10.5px;letter-spacing:2px;color:#B08A45;margin-bottom:8px}
.credit b{display:block;font-family:"Reem Kufi",serif;font-weight:600;font-size:15.5px;color:var(--ink);line-height:1.6}
.credit .gold{display:block;font-family:"Reem Kufi",serif;font-weight:600;font-size:14.5px;line-height:1.7;
  background:linear-gradient(90deg,#B98B37,#E7C87C,#B98B37);-webkit-background-clip:text;background-clip:text;color:transparent}
.credit .motto{display:block;font-size:12.5px;color:#9A8763;margin-top:6px}
.credit .hr{height:1px;background:linear-gradient(90deg,transparent,#E2D2AE,transparent);margin:14px 0}
.credit .wa{display:inline-flex;align-items:center;gap:8px;background:#12A150;color:#fff;border-radius:12px;
  padding:11px 18px;font-weight:700;font-size:13.5px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.blob{animation:none}*{transition-duration:.2s!important}}
</style>
</head>

/* ===== السماء الكونية ===== */
const sky=document.getElementById('sky'), sx=sky.getContext('2d');
let stars=[], planets=[], shoot=null, skyRAF=null;
function initSky(){
  const dpr=Math.min(2,devicePixelRatio||1);
  sky.width=innerWidth*dpr; sky.height=innerHeight*dpr; sky.style.width=innerWidth+'px'; sky.style.height=innerHeight+'px';
  sx.setTransform(dpr,0,0,dpr,0,0);
  stars=[]; const n=Math.round(innerWidth*innerHeight/5200);
  for(let i=0;i<n;i++) stars.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.3+.3,
    a:Math.random(),sp:.004+Math.random()*.012,dx:(Math.random()-.5)*.02});
  planets=[
   {x:innerWidth*.18,y:innerHeight*.20,r:34,c1:"#6E86FF",c2:"#2A3A8C",ring:0,vx:.012,vy:.006},
   {x:innerWidth*.80,y:innerHeight*.42,r:22,c1:"#F2B36B",c2:"#8A5A22",ring:1,vx:-.010,vy:.008},
   {x:innerWidth*.55,y:innerHeight*.78,r:15,c1:"#8CE0D0",c2:"#1E6A61",ring:0,vx:.008,vy:-.007}
  ];
}
function drawSky(){
  const w=innerWidth,h=innerHeight;
  const bg=sx.createLinearGradient(0,0,w,h);
  bg.addColorStop(0,"#070B16"); bg.addColorStop(.5,"#0A1122"); bg.addColorStop(1,"#05070F");
  sx.fillStyle=bg; sx.fillRect(0,0,w,h);
  const neb=sx.createRadialGradient(w*.75,h*.25,10,w*.75,h*.25,Math.max(w,h)*.6);
  neb.addColorStop(0,"rgba(90,70,200,.18)"); neb.addColorStop(1,"rgba(0,0,0,0)");
  sx.fillStyle=neb; sx.fillRect(0,0,w,h);
  planets.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<-60)p.x=w+60; if(p.x>w+60)p.x=-60; if(p.y<-60)p.y=h+60; if(p.y>h+60)p.y=-60;
    if(p.ring){sx.save();sx.translate(p.x,p.y);sx.rotate(-.42);sx.strokeStyle="rgba(240,210,160,.45)";sx.lineWidth=2.4;
      sx.beginPath();sx.ellipse(0,0,p.r*1.9,p.r*.55,0,0,7);sx.stroke();sx.restore()}
    const g=sx.createRadialGradient(p.x-p.r*.35,p.y-p.r*.35,p.r*.15,p.x,p.y,p.r);
    g.addColorStop(0,p.c1); g.addColorStop(1,p.c2);
    sx.fillStyle=g; sx.beginPath(); sx.arc(p.x,p.y,p.r,0,7); sx.fill();
    sx.fillStyle="rgba(255,255,255,.06)"; sx.beginPath(); sx.arc(p.x,p.y,p.r*1.35,0,7); sx.fill();
  });
  stars.forEach(s=>{
    s.a+=s.sp; s.x+=s.dx; if(s.x<0)s.x=w; if(s.x>w)s.x=0;
    const al=.35+Math.abs(Math.sin(s.a))*.65;
    sx.globalAlpha=al; sx.fillStyle="#fff";
    sx.beginPath(); sx.arc(s.x,s.y,s.r,0,7); sx.fill();
  });
  sx.globalAlpha=1;
  if(!shoot&&Math.random()<.004) shoot={x:Math.random()*w*.7,y:Math.random()*h*.4,l:0};
  if(shoot){
    shoot.l+=9; shoot.x+=7; shoot.y+=4;
    const grad=sx.createLinearGradient(shoot.x,shoot.y,shoot.x-70,shoot.y-40);
    grad.addColorStop(0,"rgba(255,255,255,.9)"); grad.addColorStop(1,"rgba(255,255,255,0)");
    sx.strokeStyle=grad; sx.lineWidth=2; sx.beginPath(); sx.moveTo(shoot.x,shoot.y); sx.lineTo(shoot.x-70,shoot.y-40); sx.stroke();
    if(shoot.l>260) shoot=null;
  }
  skyRAF=requestAnimationFrame(drawSky);
}
function setTheme(d){
  dark=d; document.body.classList.toggle('dark',d);
  applyPalette(PALETTES[pi]);
  if(d){ initSky(); if(!skyRAF) drawSky(); }
  else { if(skyRAF){cancelAnimationFrame(skyRAF);skyRAF=null} sx.clearRect(0,0,sky.width,sky.height) }
}
addEventListener('resize',()=>{ if(dark) initSky() });

/* ===== الرسم ===== */
let _uid=0;
function frameSVG(m,big){
  const u="u"+(++_uid);
  const W=200,H=Math.max(70,Math.round(200*(m.h/m.w))),pad=8;
  const iw=W-pad*2, ih=H-pad*2;
  const arch=m.arch?Math.min(34,iw*0.22):0;
  const topH=m.glassTop?ih*0.24:0;
  const bY=pad+topH+arch, bH=ih-topH-arch;
  const cols=m.cols||1, cw=iw/cols;
  const glass=m.frosted?`url(#fr${u})`:`url(#gl${u})`;
  let g="";
  const panel=(x,y,w,h,type)=>{
    let o=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="${type==='solid'?`url(#al${u})`:glass}" stroke="#8A97A9" stroke-width="1.3"/>`;
    if(type==='glass'||type==='frost')
      o+=`<path d="M${x+w*.10} ${y+h} L${x+w*.52} ${y} L${x+w*.74} ${y} L${x+w*.32} ${y+h} Z" fill="#fff" opacity=".30"/>
          <path d="M${x+w*.62} ${y+h} L${x+w*.92} ${y} L${x+w*.99} ${y} L${x+w*.69} ${y+h} Z" fill="#fff" opacity=".16"/>`;
    if(type==='solid') for(let k=1;k<4;k++) o+=`<path d="M${x} ${y+h*k/4} h${w}" stroke="#9DA9B9" stroke-width="1" opacity=".8"/>`;
    if(type==='mesh') o+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#ms${u})"/>`;
    return o;
  };
  const handleV=(x,y,h)=>`<rect x="${x-1.6}" y="${y+h*.42}" width="3.2" height="${Math.min(28,h*.18)}" rx="1.6" fill="#6E7A8C"/>`;
  const hinges=(x,y,h)=>[.18,.5,.82].map(k=>`<rect x="${x-2}" y="${y+h*k-4}" width="4" height="8" rx="1.5" fill="#7A8698"/>`).join("");
  const arrow=(cx,cy,dir)=>`<path d="M${cx-11*dir} ${cy} h${22*dir} M${cx+11*dir} ${cy} l${-5*dir} -4 M${cx+11*dir} ${cy} l${-5*dir} 4" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
  for(let i=0;i<cols;i++){
    const x=pad+i*cw+3, y=bY+3, w=cw-6, h=bH-6;
    const isSolid=i<(m.solid||0), isMesh=m.mesh&&i===cols-1;
    const type=isSolid?'solid':(isMesh?'mesh':(m.frosted?'frost':'glass'));
    g+=panel(x,y,w,h,type);
    const cx=x+w/2, cy=y+h/2;
    if(m.slide&&!isSolid&&!isMesh&&!(m.halffixed&&i===0)) g+=arrow(cx,cy,1);
    if(m.auto) g+=arrow(cx,cy,i===0?-1:1);
    if(m.fold) g+=`<path d="M${x+w*.5} ${y} v${h}" stroke="#9DA9B9" stroke-width="1" stroke-dasharray="3 3"/>`;
    if(m.project&&i===0) g+=`<path d="M${x+4} ${y+h-6} L${cx} ${y+6} L${x+w-4} ${y+h-6}" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
    if(m.hinge==='both'){ if(i===0){g+=handleV(x+w-4,y,h);g+=hinges(x+1,y,h)} else {g+=handleV(x+4,y,h);g+=hinges(x+w-1,y,h)} }
    else if(m.hinge&&i===cols-1){ g+=handleV(x+6,y,h); g+=hinges(x+w-1,y,h) }
    if(m.guard) for(let k=1;k<5;k++) g+=`<path d="M${x+w*k/5} ${y} v${h}" stroke="#9DA9B9" stroke-width="1.2" opacity=".9"/>`;
    if(m.halffixed&&i===0) g+=`<circle cx="${cx}" cy="${cy}" r="2.4" fill="#9DA9B9"/>`;
  }
  if(m.glassTop) g+=panel(pad+3,pad+arch+3,iw-6,topH-6,'glass');
  if(m.auto) g+=`<rect x="${pad+iw/2-9}" y="${pad-5}" width="18" height="4" rx="2" fill="currentColor"/>`;
  const outer=arch
    ? `<path d="M${pad} ${H-pad} V${pad+arch} A${iw/2} ${arch} 0 0 1 ${W-pad} ${pad+arch} V${H-pad} Z" fill="url(#al${u})" stroke="#7F8C9E" stroke-width="2"/>`
    : `<rect x="${pad}" y="${pad}" width="${iw}" height="${ih}" rx="3" fill="url(#al${u})" stroke="#7F8C9E" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${m.n[li()]}"
      style="color:var(--brand);transition:color var(--T)">
    <defs>
      <linearGradient id="al${u}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#F4F7FA"/><stop offset=".45" stop-color="#D2DAE4"/>
        <stop offset=".55" stop-color="#C2CBD8"/><stop offset="1" stop-color="#A7B2C1"/></linearGradient>
      <linearGradient id="gl${u}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#DCEAF4"/><stop offset=".5" stop-color="#C6DCEC"/><stop offset="1" stop-color="#B3D0E3"/></linearGradient>
      <linearGradient id="fr${u}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#E4EDF3"/><stop offset="1" stop-color="#CFDDE6"/></linearGradient>
      <pattern id="ms${u}" width="3.5" height="3.5" patternUnits="userSpaceOnUse">
        <path d="M0 0H3.5M0 0V3.5" stroke="#7F8C9E" stroke-width=".5" opacity=".75"/></pattern>
    </defs>
    ${outer}${g}
    <rect x="${pad+2}" y="${pad+2}" width="${iw-4}" height="${ih-4}" rx="2" fill="none" stroke="#fff" stroke-width="1" opacity=".45"/>
  </svg>`;
}
const art=(m,big)=>m.img?`<img src="${m.img}" alt="${m.n[li()]}" loading="lazy" class="photo${big?' big':''}">`:frameSVG(m,big);
const catName=k=>CATS.find(c=>c.k===k).n[li()];

/* ===== البطاقات ===== */
function prodHTML(m){
  const i=li();
  const badge=m.hot?`<span class="pill">${t().badgeHot}</span>`:(m.newy?`<span class="pill">${t().badgeNew}</span>`:'');
  return `<button class="prod" data-model="${m.id}">
    <span class="art">${badge}${art(m)}</span>
    <span class="meta"><b>${m.n[i]}</b><span class="desc">${m.s[i]}</span>
      <span class="buy"><span class="price">${t().priceAfter}</span><span class="add" aria-hidden="true">+</span></span>
    </span></button>`;
}
function renderShop(){
  const i=li();
  let list=MODELS.filter(m=>filter==="all"||m.c===filter);
  if(query){const q=query.toLowerCase();
    list=list.filter(m=>(m.n[i]+m.s[i]+m.d[i]+m.t[i].join(" ")+catName(m.c)).toLowerCase().includes(q));}
  document.getElementById('grid').innerHTML=list.map(prodHTML).join('');
  document.getElementById('empty').hidden=list.length>0;
  document.getElementById('count').textContent=list.length+" "+t().countSuffix;
  document.getElementById('shop-title').textContent=filter==="all"?t().allProducts:catName(filter);
  document.querySelectorAll('[data-chip]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.chip===filter));
}
function renderAll(){
  const i=li();
  document.getElementById('cats').innerHTML=CATS.map(c=>
    `<button class="cat" data-cat="${c.k}"><span class="ci"><svg viewBox="0 0 24 24"><path d="${c.p}"/></svg></span><span>${c.n[i]}</span></button>`).join('');
  document.getElementById('rail').innerHTML=MODELS.filter(m=>m.hot).map(prodHTML).join('');
  document.getElementById('new-grid').innerHTML=MODELS.filter(m=>m.newy).slice(0,4).map(prodHTML).join('');
  document.getElementById('chips').innerHTML=[{k:"all",n:t().all}].concat(CATS.map(c=>({k:c.k,n:c.n[i]})))
    .map(c=>`<button class="chip" aria-pressed="${c.k===filter}" data-chip="${c.k}">${c.n}</button>`).join('');
  document.getElementById('steps').innerHTML=t().steps.map((s,k)=>
    `<div class="step"><i>${k+1}</i><div><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join('');
  renderShop(); renderCart();
}

function fillUI(){
  const x=t();
  document.documentElement.lang=lang; document.documentElement.dir=x.dir;
  document.documentElement.style.setProperty('--font',`"${FONTS[lang][fontIdx][0]}",system-ui,sans-serif`);
  setTxt('t-brand',x.brand); setTxt('t-addr',x.addr);
  document.getElementById('q').placeholder=x.searchPh;
  x.tab.forEach((v,i)=>setTxt('t-tab'+(i+1),v));
  setTxt('t-bannerT',x.bannerT); setTxt('t-bannerP',x.bannerP); setTxt('t-bannerB',x.bannerB);

/* تعليمات المساعد — محصورة بالألمنيوم وهذا المعرض فقط */
function aiSystem(){

    "5) جاوب بنفس لغة الزبون. إذا كتب بالعربية استخدم لهجة عراقية بسيطة ومهذبة.",
    "6) الجواب قصير وعملي: من جملتين إلى أربع جمل، أو نقاط قصيرة تبدأ بـ • عند الحاجة. بدون رموز markdown مثل ** أو ##.",

  ].join("\n");

function aiAdd(cls,text){
  const d=document.createElement('div');
  d.className='msg '+cls; d.textContent=text;      /* textContent = لا حقن HTML */
  aiBody.appendChild(d); aiBody.scrollTop=aiBody.scrollHeight; return d;
}
function aiDots(){
  const d=document.createElement('div'); d.className='dots'; d.innerHTML='<i></i><i></i><i></i>';
  aiBody.appendChild(d); aiBody.scrollTop=aiBody.scrollHeight; return d;
}
function aiReset(){
  const x=t();
  aiHistory=[]; aiBody.innerHTML=''; aiAdd('bot',x.aiHi);
  const box=document.getElementById('ai-chips'); box.innerHTML='';
  x.aiChips.forEach(q=>{const b=document.createElement('button');b.textContent=q;
    b.onclick=()=>{aiInput.value=q;aiSend()};box.appendChild(b)});
}

async function aiSend(){
  const x=t(), msg=aiInput.value.trim();
  if(!msg||aiBusy) return;
  if(!AI.PROXY&&!AI.KEY){aiAdd('err',x.aiNoKey);return}
  aiInput.value=''; aiInput.style.height='auto';
  aiAdd('me',msg); aiHistory.push({role:"user",parts:[{text:msg}]});
  aiBusy=true; aiSendBtn.disabled=true;
  const dots=aiDots();
  try{
    /* المفتاح كـ query param بدل الترويسة — أبسط لطلبات المتصفح */
    const url=AI.PROXY||`https://generativelanguage.googleapis.com/v1beta/models/${AI.MODEL}:generateContent?key=${encodeURIComponent(AI.KEY)}`;
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      system_instruction:{parts:[{text:aiSystem()}]},
      contents:aiHistory.slice(-12),
      generationConfig:{temperature:0.4,maxOutputTokens:600}
    })});
    if(!r.ok){const b=await r.text().catch(()=>""); throw new Error("HTTP "+r.status+" "+b.slice(0,200))}
    const data=await r.json();
    const out=(data?.candidates?.[0]?.content?.parts||[]).map(z=>z.text||"").join("").trim();
    dots.remove();
    if(!out) throw new Error("empty");
    aiAdd('bot',out); aiHistory.push({role:"model",parts:[{text:out}]});
  }catch(err){
    dots.remove(); aiHistory.pop(); console.error(err);
    const m=String(err&&err.message||err);
    let why=x.aiErr;
    if(m.includes("Failed to fetch")||err instanceof TypeError) why=x.aiLocal;   /* file:// أو الشبكة */
    else if(m.includes("403")||m.includes("400")) why=x.aiBadKey;                /* مفتاح ملغى/مقيّد */
    else if(m.includes("429")) why=x.aiQuota;                                    /* تجاوز الحصة */
    aiAdd('err',why);
  }finally{ aiBusy=false; aiSendBtn.disabled=false; aiBody.scrollTop=aiBody.scrollHeight; }
}
